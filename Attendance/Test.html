<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Device & Location Info</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: sans-serif; padding: 30px; text-align: center; }
    pre { text-align: left; background: #f4f4f4; padding: 15px; border-radius: 8px; }
    button { padding: 12px 24px; margin: 10px; font-size: 16px; }
  </style>
</head>
<body>

  <h2>Device Info</h2>
  <button onclick="getDeviceInfo()">Get Device Info</button>
  <pre id="deviceInfo">Click the button to get info...</pre>

  <h2>Location</h2>
  <button onclick="getLocation()">Get Location</button>
  <div id="location">Location info will appear here...</div>

  <script>
    async function getDeviceInfo() {
      const info = {
        "User Agent": navigator.userAgent,
        "Language": navigator.language,
        "Time Zone": Intl.DateTimeFormat().resolvedOptions().timeZone,
        "Screen Resolution": `${screen.width} x ${screen.height}`,
        "Platform": navigator.platform,
        "Touch Support": 'ontouchstart' in window ? "Yes" : "No"
      };

      // Battery info
      if (navigator.getBattery) {
        const battery = await navigator.getBattery();
        info["Battery Level"] = Math.round(battery.level * 100) + "%";
        info["Charging"] = battery.charging ? "Yes" : "No";
      }

      // Network info
      if (navigator.connection) {
        info["Network Type"] = navigator.connection.effectiveType || "Unknown";
      }

      document.getElementById("deviceInfo").innerText = JSON.stringify(info, null, 2);
    }

    function getLocation() {
      const loc = document.getElementById("location");
      loc.innerText = "Getting location...";

      if (!navigator.geolocation) {
        loc.innerText = "Geolocation not supported.";
        return;
      }

      navigator.geolocation.getCurrentPosition(pos => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        loc.innerText = `Latitude: ${lat.toFixed(6)}, Longitude: ${lon.toFixed(6)}`;
      }, err => {
        loc.innerText = "Error: " + err.message;
      }, {
        enableHighAccuracy: true,
        timeout: 8000,
        maximumAge: 0
      });
    }
  </script>

</body>
</html>
