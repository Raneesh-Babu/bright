<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fast Get Location</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 30px;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
    }

    #coords {
      margin-top: 20px;
      font-size: 16px;
      color: blue;
      cursor: pointer;
      display: none;
      text-decoration: underline;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
    }

    .modal-content {
      position: relative;
      background: #fff;
      margin: 10% auto;
      width: 90%;
      max-width: 500px;
      height: 400px;
      border-radius: 8px;
      overflow: hidden;
    }

    .close {
      position: absolute;
      top: 8px;
      right: 12px;
      font-size: 24px;
      color: #444;
      cursor: pointer;
      z-index: 10;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    #status {
      margin-top: 15px;
      color: #888;
    }
  </style>
</head>
<body>

  <h3>Find My Location</h3>
  <button onclick="getLocation()">Get Location</button>
  <div id="status"></div>
  <div id="coords" onclick="openMap()"></div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeMap()">&times;</span>
      <div id="map"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let lat = 0, lon = 0;
    let map, marker;
    let mapLoaded = false;
    let locationTimeout;

    function getLocation() {
      const coordsDiv = document.getElementById("coords");
      const status = document.getElementById("status");
      coordsDiv.style.display = "none";
      coordsDiv.innerText = "";
      status.innerText = "Getting your location...";

      if (!navigator.geolocation) {
        status.innerText = "Geolocation not supported on this device.";
        return;
      }

      // Set a timeout to handle delay
      locationTimeout = setTimeout(() => {
        status.innerText = "Failed to get location. Please ensure GPS is enabled.";
      }, 8000); // 8 seconds fallback

      navigator.geolocation.getCurrentPosition(success, error, {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      });

      function success(pos) {
        clearTimeout(locationTimeout);
        lat = pos.coords.latitude;
        lon = pos.coords.longitude;
        coordsDiv.innerText = `Latitude: ${lat.toFixed(5)}, Longitude: ${lon.toFixed(5)} (Tap to view map)`;
        coordsDiv.style.display = "block";
        status.innerText = "";
      }

      function error(err) {
        clearTimeout(locationTimeout);
        status.innerText = "Error getting location: " + err.message;
      }
    }

    function openMap() {
      document.getElementById("modal").style.display = "block";

      setTimeout(() => {
        if (!mapLoaded) {
          map = L.map('map').setView([lat, lon], 15);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
          }).addTo(map);
          marker = L.marker([lat, lon]).addTo(map).bindPopup("You are here").openPopup();
          mapLoaded = true;
        } else {
          map.setView([lat, lon], 15);
          marker.setLatLng([lat, lon]);
        }
      }, 100);
    }

    function closeMap() {
      document.getElementById("modal").style.display = "none";
    }
  </script>

</body>
</html>
