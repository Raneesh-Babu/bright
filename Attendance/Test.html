<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Location to Map Modal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      cursor: pointer;
    }

    #coords {
      margin-top: 20px;
      font-size: 18px;
      color: blue;
      cursor: pointer;
      text-decoration: underline;
      display: none;
    }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.5);
    }

    .modal-content {
      background-color: #fff;
      margin: 10% auto;
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 600px;
      position: relative;
    }

    .close {
      position: absolute;
      right: 15px;
      top: 10px;
      font-size: 25px;
      font-weight: bold;
      color: #aaa;
      cursor: pointer;
    }

    .close:hover {
      color: #000;
    }

    iframe {
      width: 100%;
      height: 400px;
      border: none;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <h2>Show My Location</h2>
  <button onclick="getLocation()">Get Current Location</button>
  <div id="coords" onclick="openModal()"></div>

  <!-- Modal -->
  <div id="mapModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <iframe id="mapFrame" src=""></iframe>
    </div>
  </div>

  <script>
    let lat = 0;
    let lon = 0;

    function getLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(showPosition, showError);
      } else {
        alert("Geolocation is not supported by this browser.");
      }
    }

    function showPosition(position) {
      lat = position.coords.latitude;
      lon = position.coords.longitude;
      const coordsText = `Latitude: ${lat.toFixed(6)}, Longitude: ${lon.toFixed(6)} (Click to view map)`;
      document.getElementById("coords").innerText = coordsText;
      document.getElementById("coords").style.display = 'block';
    }

    function showError(error) {
      switch(error.code) {
        case error.PERMISSION_DENIED:
          alert("User denied the request for Geolocation.");
          break;
        case error.POSITION_UNAVAILABLE:
          alert("Location information is unavailable.");
          break;
        case error.TIMEOUT:
          alert("The request to get user location timed out.");
          break;
        default:
          alert("An unknown error occurred.");
          break;
      }
    }

    function openModal() {
      const mapUrl = `https://maps.google.com/maps?q=${lat},${lon}&z=15&output=embed`;
      document.getElementById("mapFrame").src = mapUrl;
      document.getElementById("mapModal").style.display = "block";
    }

    function closeModal() {
      document.getElementById("mapModal").style.display = "none";
      document.getElementById("mapFrame").src = "";
    }
  </script>

</body>
</html>
