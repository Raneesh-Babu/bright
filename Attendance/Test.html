<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Leaflet Location Map Modal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      cursor: pointer;
    }

    #coords {
      margin-top: 20px;
      font-size: 18px;
      color: blue;
      cursor: pointer;
      text-decoration: underline;
      display: none;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
    }

    .modal-content {
      background-color: #fff;
      margin: 5% auto;
      padding: 0;
      border-radius: 10px;
      width: 90%;
      max-width: 600px;
      height: 500px;
      position: relative;
      overflow: hidden;
    }

    .close {
      position: absolute;
      right: 10px;
      top: 10px;
      font-size: 24px;
      font-weight: bold;
      color: #333;
      cursor: pointer;
      z-index: 1001;
    }

    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <h2>Show My Location</h2>
  <button onclick="getLocation()">Get Current Location</button>
  <div id="coords" onclick="openModal()"></div>

  <!-- Modal -->
  <div id="mapModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <div id="map"></div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    let lat = 0;
    let lon = 0;
    let map = null;
    let marker = null;

    function getLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(showPosition, showError);
      } else {
        alert("Geolocation is not supported by this browser.");
      }
    }

    function showPosition(position) {
      lat = position.coords.latitude;
      lon = position.coords.longitude;
      document.getElementById("coords").innerText = `Latitude: ${lat.toFixed(6)}, Longitude: ${lon.toFixed(6)} (Tap to view map)`;
      document.getElementById("coords").style.display = "block";
    }

    function openModal() {
      document.getElementById("mapModal").style.display = "block";

      // Delay map creation to allow modal to appear
      setTimeout(() => {
        if (!map) {
          map = L.map('map').setView([lat, lon], 15);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
          }).addTo(map);
          marker = L.marker([lat, lon]).addTo(map)
            .bindPopup("You are here")
            .openPopup();
        } else {
          map.setView([lat, lon], 15);
          marker.setLatLng([lat, lon]);
        }
      }, 100);
    }

    function closeModal() {
      document.getElementById("mapModal").style.display = "none";
    }

    function showError(error) {
      switch(error.code) {
        case error.PERMISSION_DENIED:
          alert("Permission denied for Geolocation.");
          break;
        case error.POSITION_UNAVAILABLE:
          alert("Location unavailable.");
          break;
        case error.TIMEOUT:
          alert("Geolocation timed out.");
          break;
        default:
          alert("An unknown error occurred.");
      }
    }
  </script>

</body>
</html>
