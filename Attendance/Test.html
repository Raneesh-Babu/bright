<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Location Viewer</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 20px;
    }
    button {
        padding: 10px 20px;
        background: #007bff;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 5px;
    }
    button:hover {
        background: #0056b3;
    }
    /* Modal styling */
    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0; top: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.5);
        justify-content: center;
        align-items: center;
    }
    .modal-content {
        background: white;
        padding: 15px;
        border-radius: 8px;
        max-width: 90%;
        width: 500px;
    }
    iframe {
        width: 100%;
        height: 400px;
        border: none;
    }
    .close {
        background: red;
        color: white;
        border: none;
        padding: 5px 10px;
        cursor: pointer;
        float: right;
        border-radius: 5px;
    }
</style>
</head>
<body>

<h2>📍 My Location</h2>
<p id="coords">Fetching location...</p>
<button id="viewBtn">View on Map</button>

<!-- Modal -->
<div class="modal" id="mapModal">
    <div class="modal-content">
        <button class="close" id="closeModal">X</button>
        <iframe id="mapFrame"></iframe>
    </div>
</div>

<script>
let latitude, longitude;

// Get location
navigator.geolocation.getCurrentPosition(
    function(position) {
        latitude = position.coords.latitude;
        longitude = position.coords.longitude;
        document.getElementById("coords").innerText =
            `Latitude: ${latitude}, Longitude: ${longitude}`;
    },
    function(error) {
        document.getElementById("coords").innerText = "Unable to fetch location.";
    }
);

// Show modal with map
document.getElementById("viewBtn").addEventListener("click", function() {
    if (latitude && longitude) {
        let mapUrl = `https://www.openstreetmap.org/export/embed.html?bbox=${longitude-0.01},${latitude-0.01},${longitude+0.01},${latitude+0.01}&layer=mapnik&marker=${latitude},${longitude}`;
        document.getElementById("mapFrame").src = mapUrl;
        document.getElementById("mapModal").style.display = "flex";
    } else {
        alert("Location not ready yet. Please try again.");
    }
});

// Close modal
document.getElementById("closeModal").addEventListener("click", function() {
    document.getElementById("mapModal").style.display = "none";
});
</script>

</body>
</html>
