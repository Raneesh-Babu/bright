<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fast Location Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Minimal Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 30px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    #coords {
      margin-top: 20px;
      font-size: 16px;
      color: blue;
      cursor: pointer;
      display: none;
      text-decoration: underline;
    }

    /* Modal styling */
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
    }

    .modal-content {
      position: relative;
      background: #fff;
      margin: 10% auto;
      width: 90%;
      max-width: 500px;
      height: 400px;
      border-radius: 8px;
      overflow: hidden;
    }

    .close {
      position: absolute;
      top: 8px;
      right: 12px;
      font-size: 24px;
      color: #444;
      cursor: pointer;
      z-index: 10;
    }

    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <h3>Find My Location</h3>
  <button onclick="getLocation()">Get Location</button>
  <div id="coords" onclick="openMap()">Loading...</div>

  <!-- Modal -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeMap()">&times;</span>
      <div id="map"></div>
    </div>
  </div>

  <!-- Minified Leaflet JS (deferred load) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>

  <script>
    let lat = 0, lon = 0;
    let map, marker;
    let mapLoaded = false;

    function getLocation() {
      if (!navigator.geolocation) {
        alert("Geolocation not supported");
        return;
      }

      navigator.geolocation.getCurrentPosition(pos => {
        lat = pos.coords.latitude;
        lon = pos.coords.longitude;
        document.getElementById("coords").innerText = `Latitude: ${lat.toFixed(5)}, Longitude: ${lon.toFixed(5)} (Tap to View Map)`;
        document.getElementById("coords").style.display = "block";
      }, err => {
        alert("Failed to get location.");
      });
    }

    function openMap() {
      document.getElementById("modal").style.display = "block";

      // Load map only once
      if (!mapLoaded) {
        setTimeout(() => {
          map = L.map('map').setView([lat, lon], 15);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
          }).addTo(map);

          marker = L.marker([lat, lon]).addTo(map).bindPopup("You are here").openPopup();
          mapLoaded = true;
        }, 100);
      } else {
        map.setView([lat, lon], 15);
        marker.setLatLng([lat, lon]);
      }
    }

    function closeMap() {
      document.getElementById("modal").style.display = "none";
    }
  </script>

</body>
</html>
