<!DOCTYPE html>
<html>
<head>
  <title>Get Location and Open Map</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      text-align: center;
    }
    button {
      padding: 15px 25px;
      font-size: 18px;
      cursor: pointer;
    }
    #coords {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <h2>Get My Location</h2>
  <button onclick="getLocation()">Show My Location & Open Map</button>
  <div id="coords">Coordinates will appear here</div>

  <script>
    function getLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(showPosition, showError);
      } else {
        document.getElementById("coords").innerText = "Geolocation is not supported by this browser.";
      }
    }

    function showPosition(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      // Show text
      document.getElementById("coords").innerText = `Latitude: ${lat}, Longitude: ${lon}`;

      // Open in Google Maps
      const mapUrl = `https://www.google.com/maps?q=${lat},${lon}`;
      window.open(mapUrl, '_blank');
    }

    function showError(error) {
      switch(error.code) {
        case error.PERMISSION_DENIED:
          alert("User denied the request for Geolocation.");
          break;
        case error.POSITION_UNAVAILABLE:
          alert("Location information is unavailable.");
          break;
        case error.TIMEOUT:
          alert("The request to get user location timed out.");
          break;
        case error.UNKNOWN_ERROR:
          alert("An unknown error occurred.");
          break;
      }
    }
  </script>

</body>
</html>
