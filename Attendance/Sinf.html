<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🔎 Invoice Search</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<style>
  * { box-sizing: border-box; transition: all 0.4s ease; }
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #f8f9ff;
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  main {
    max-width: 850px;
    width: 95%;
    margin-top: 25px;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
  }
  input {
    width: 100%;
    padding: 12px 15px;
    font-size: 16px;
    border-radius: 10px;
    border: 2px solid #e4e4e4;
    outline: none;
    margin-bottom: 15px;
  }
  input:focus {
    border-color: #6a11cb;
    box-shadow: 0 0 8px rgba(106,17,203,0.2);
  }
  button {
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    border: none;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    padding: 12px 30px;
    border-radius: 10px;
    cursor: pointer;
    width: 100%;
    margin-top: 10px;
  }
  .invoice-details {
    position: relative;
    margin: 0 auto;
    padding: 20px;
    border-radius: 15px;
    background: linear-gradient(180deg, #ffffff 0%, #f4f6ff 100%);
    border: 2px solid #dcdfff;
    max-width: 600px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
  }
  .invoice-header {
    text-align: center;
    color: #2d2f91;
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .invoice-header img {
    width: 300px;
    height: auto;
    margin-bottom: 10px;
  }
  .invoice-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .invoice-info { flex: 1; }

  .qr-code {
    cursor: pointer;
    display: inline-block;
    user-select: none;
    -webkit-user-select: none;
  }
  .qr-code canvas {
    width: 100px;
    height: 100px;
    display: block;
  }
  .copied-msg {
    position: absolute;
    right: 20px;
    top: 8px;
    background: rgba(45,47,145,0.95);
    color: #fff;
    font-size: 12px;
    padding: 6px 8px;
    border-radius: 6px;
    transform: translateY(-120%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .copied-msg.show {
    opacity: 1;
    transform: translateY(-100%);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    font-size: 14px;
    border-radius: 10px;
    overflow: hidden;
  }
  th, td {
    padding: 8px;
    text-align: center;
    border-bottom: 1px solid #ddd;
  }
  th { background: #6a11cb; color: white; }
  tr:nth-child(even) { background: #f9f9ff; }
  .total-section {
    margin-top: 15px;
    text-align: right;
    font-size: 16px;
    font-weight: 600;
    color: #2d2f91;
  }
  .footer-msg {
    text-align: center;
    font-size: 14px;
    margin-top: 25px;
    color: #6a11cb;
    font-weight: 500;
  }
  .contact-info {
    text-align: center;
    color: #2575fc;
    margin-top: 5px;
    font-weight: 500;
  }
  .fullscreen {
    background: #ffffff;
    height: 100vh;
    width: 100vw;
    overflow-y: auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .no-result { color: red; text-align: center; margin-top: 20px; font-weight: 500; }
  .hidden { display: none !important; }
  .debug-info {
    background: #f0f0f0;
    padding: 10px;
    border-radius: 5px;
    margin: 10px 0;
    font-size: 12px;
    color: #666;
  }
  @media (max-width: 600px) {
    .invoice-header img { width: 200px; }
    .qr-code canvas { width: 80px; height: 80px; }
    .copied-msg { right: 10px; top: 6px; font-size:11px; }
  }
</style>
</head>
<body>
<main id="searchArea">
  <h2 style="text-align:center;color:#2d2f91;">Search Invoice</h2>
  <p style="text-align:center;color:#666;">Enter an invoice number to view full invoice.</p>

  <input type="text" id="invoiceInput" placeholder="Enter Invoice Number (e.g. 28102025195329)" />
  <button onclick="searchInvoice()">🔍 Search</button>
</main>

<div id="resultArea"></div>

<script>
// ✅ UPDATED: Correct Web Baserow API configuration
const BASEROW_API_URL = "https://api.baserow.io/api/database/rows/table/781249/?user_field_names=true";
const BASEROW_API_KEY = "FoELccYGXhpK4LW4eHEuF2oeRqOnJt0f";

// ✅ UPDATED: Field mappings based on your table configuration
const FIELD_MAPPINGS = {
  PRODUCT_NAME: "field_6651957",      // Product Name
  PRODUCT_CODE: "field_6651958",      // Product Code
  QUANTITY: "field_6651959",          // Quantity
  PRICE_PER_UNIT: "field_6651960",    // Price Per Unit
  TOTAL_PRICE: "field_6651961",       // Total Price
  DATE_TIME: "field_6651962",         // Date Time
  INVOICE_NUMBER: "field_6651963"     // Invoice Number
};

function extractDateFromInvoice(invoiceNum) {
  const match = invoiceNum.match(/^(\d{2})(\d{2})(\d{4})/);
  if (!match) return "—";
  return `${match[1]}/${match[2]}/${match[3]}`;
}

async function searchInvoice(invoiceOverride = null) {
  const invoiceInput = document.getElementById("invoiceInput");
  const invoiceNum = (invoiceOverride || invoiceInput.value || "").trim();
  const resultArea = document.getElementById("resultArea");

  if (!invoiceNum) {
    alert("Please enter an invoice number!");
    return;
  }

  resultArea.innerHTML = "⏳ Searching invoice data...";

  try {
    console.log("Searching for invoice:", invoiceNum);
    
    // ✅ FIXED: Make API request
    const response = await fetch(BASEROW_API_URL, {
      headers: { 
        Authorization: `Token ${BASEROW_API_KEY}`,
        "Content-Type": "application/json"
      }
    });
    
    if (!response.ok) {
      throw new Error(`API Error: ${response.status} ${response.statusText}`);
    }
    
    const json = await response.json();
    console.log("API Response:", json);
    
    if (!json.results || !Array.isArray(json.results)) {
      throw new Error("Invalid API response format");
    }
    
    // ✅ FIXED: Better search logic
    const results = json.results.filter(r => {
      const invoiceField = r[FIELD_MAPPINGS.INVOICE_NUMBER];
      if (!invoiceField) return false;
      
      // Try multiple search methods
      const invoiceStr = String(invoiceField).trim();
      return invoiceStr === invoiceNum || 
             invoiceStr.includes(invoiceNum) || 
             invoiceNum.includes(invoiceStr);
    });
    
    console.log("Filtered results:", results);

    if (results.length === 0) {
      // Show debug info to help identify the issue
      const allInvoiceNumbers = json.results.map(r => r[FIELD_MAPPINGS.INVOICE_NUMBER]).filter(Boolean);
      resultArea.innerHTML = `
        <div class="no-result">
          ❌ No invoice found for <b>${invoiceNum}</b>.
          <div class="debug-info">
            <p><strong>Available invoices in database:</strong></p>
            <p>${allInvoiceNumbers.length > 0 ? allInvoiceNumbers.join(', ') : 'No invoices found in database'}</p>
            <p><em>Note: Make sure you're entering the exact invoice number as stored in Baserow</em></p>
          </div>
        </div>
      `;
      return;
    }

    const invoiceDate = extractDateFromInvoice(invoiceNum);
    const totalAmount = results.reduce((a,b) => a + (Number(b[FIELD_MAPPINGS.TOTAL_PRICE]) || 0), 0);

    let html = `
      <div class="fullscreen">
        <div class="invoice-details">
          <div class="invoice-header">
            <img src="https://workshopbright.netlify.app/IMG_20250719_210558-removebg-preview.png" alt="Logo">
            <div>INVOICE RECEIPT</div>
          </div>

          <div class="invoice-top">
            <div class="invoice-info">
              <p><b>Invoice No:</b> ${invoiceNum}</p>
              <p><b>Date:</b> ${invoiceDate}</p>
              <p><b>Items Found:</b> ${results.length}</p>
            </div>
            <div class="qr-code" id="qrButton" title="Click to copy invoice URL">
              <canvas id="qrCode"></canvas>
            </div>
          </div>

          <table>
            <thead>
              <tr>
                <th>Product</th>
                <th>Code</th>
                <th>Qty</th>
                <th>Price/Unit</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody>
    `;

    results.forEach(r => {
      const qty = Number(r[FIELD_MAPPINGS.QUANTITY]) || 0;
      const total = Number(r[FIELD_MAPPINGS.TOTAL_PRICE]) || 0;
      const priceUnit = qty ? (total / qty).toFixed(2) : "0.00";

      html += `
        <tr>
          <td>${r[FIELD_MAPPINGS.PRODUCT_NAME] || "-"}</td>
          <td>${r[FIELD_MAPPINGS.PRODUCT_CODE] || "-"}</td>
          <td>${qty}</td>
          <td>₹${priceUnit}</td>
          <td>₹${total.toLocaleString()}</td>
        </tr>`;
    });

    html += `
            </tbody></table>
            <div class="total-section">Grand Total: ₹${totalAmount.toLocaleString()}</div>
            <div class="footer-msg">💜 Thank you for your purchase! 💙</div>
            <div class="contact-info">📞 Contact: 6238153008 (Service)</div>

            <div class="copied-msg" id="copiedMsg">Copied!</div>
          </div>
        </div>
    `;

    resultArea.innerHTML = html;
    document.getElementById("searchArea").classList.add("hidden");

    const currentUrl = `${window.location.origin}${window.location.pathname}?invoice=${encodeURIComponent(invoiceNum)}`;

    const qr = new QRious({
      element: document.getElementById("qrCode"),
      value: currentUrl,
      size: 100,
      background: 'white',
      foreground: '#2d2f91'
    });

    const qrButton = document.getElementById("qrButton");
    const copiedMsg = document.getElementById("copiedMsg");

    async function doCopy(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (e) {}
      }
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        return ok;
      } catch (e) {
        return false;
      }
    }

    qrButton.addEventListener("click", async (ev) => {
      ev.preventDefault();
      const ok = await doCopy(currentUrl);
      if (ok) {
        copiedMsg.classList.add("show");
        setTimeout(() => copiedMsg.classList.remove("show"), 1500);
      } else {
        window.open(currentUrl, "_blank");
      }
    });

  } catch (err) {
    resultArea.innerHTML = `<p class='no-result'>❌ Error fetching data: ${err.message}</p>`;
    console.error("Invoice search error:", err);
  }
}

window.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(window.location.search);
  const invoiceParam = params.get("invoice");
  if (invoiceParam) {
    document.getElementById("invoiceInput").value = invoiceParam;
    searchInvoice(invoiceParam);
  }
});

// ✅ ADDED: Keyboard support for Enter key
document.getElementById("invoiceInput").addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    searchInvoice();
  }
});
</script>
</body>
</html>
