<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barcode Scanner with Count</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #f5f6fa;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .scanner-container {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
    }

    #reader {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 15px;
      display: none;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 10px;
      outline: none;
      text-align: center;
    }

    input:focus {
      border-color: #007bff;
      box-shadow: 0 0 5px rgba(0,123,255,0.3);
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      margin: 10px 5px;
      cursor: pointer;
      transition: background 0.3s;
    }

    #startBtn { background: #007bff; color: white; }
    #startBtn:hover { background: #0056b3; }

    #stopBtn { background: #dc3545; color: white; }
    #stopBtn:hover { background: #a71d2a; }

    #addBtn { background: #28a745; color: white; display: none; }
    #addBtn:hover { background: #1c7d31; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      border-bottom: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }

    th {
      background: #007bff;
      color: white;
      border-radius: 4px;
    }

    @media (max-width: 600px) {
      .scanner-container { padding: 15px; }
      button, input { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="scanner-container">
    <h2>📷 Barcode Scanner</h2>

    <div id="reader"></div>

    <div>
      <button id="startBtn">Start Camera</button>
      <button id="stopBtn" disabled>Stop Camera</button>
    </div>

    <input type="text" id="barcode" placeholder="Scanned code will appear here" readonly>
    <button id="addBtn">➕ Add</button>

    <table id="resultTable">
      <thead>
        <tr>
          <th>Barcode</th>
          <th>Count</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const html5QrCode = new Html5Qrcode("reader");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const readerDiv = document.getElementById("reader");
    const barcodeInput = document.getElementById("barcode");
    const addBtn = document.getElementById("addBtn");
    const tableBody = document.querySelector("#resultTable tbody");

    let isScanning = false;
    let scannedCode = "";
    const scannedItems = {}; // Store {code: count}

    async function startCamera() {
      if (isScanning) return;
      readerDiv.style.display = "block";
      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          (decodedText) => {
            scannedCode = decodedText;
            barcodeInput.value = decodedText;
            addBtn.style.display = "inline-block";
            barcodeInput.style.borderColor = "#28a745";
            console.log("Scanned:", decodedText);
          }
        );
        isScanning = true;
        startBtn.disabled = true;
        stopBtn.disabled = false;
      } catch (err) {
        alert("Unable to access camera: " + err);
      }
    }

    async function stopCamera() {
      if (!isScanning) return;
      await html5QrCode.stop();
      readerDiv.style.display = "none";
      isScanning = false;
      startBtn.disabled = false;
      stopBtn.disabled = true;
    }

    function addBarcode() {
      if (!scannedCode) return;
      if (scannedItems[scannedCode]) {
        scannedItems[scannedCode]++;
      } else {
        scannedItems[scannedCode] = 1;
      }
      updateTable();
      barcodeInput.value = "";
      scannedCode = "";
      addBtn.style.display = "none";
    }

    function updateTable() {
      tableBody.innerHTML = "";
      for (let code in scannedItems) {
        const row = `<tr>
          <td>${code}</td>
          <td>${scannedItems[code]}</td>
        </tr>`;
        tableBody.innerHTML += row;
      }
    }

    startBtn.addEventListener("click", startCamera);
    stopBtn.addEventListener("click", stopCamera);
    addBtn.addEventListener("click", addBarcode);
  </script>
</body>
</html>
