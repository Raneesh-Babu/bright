<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My URL Shortener</title>
<style>
  body { font-family: Arial, sans-serif; background:#f5f7fb; text-align:center; padding:40px; }
  h1 { color:#333; }
  input, button { padding:10px; font-size:16px; margin:5px; border-radius:8px; border:1px solid #ccc; }
  button { background:#007bff; color:white; border:none; cursor:pointer; }
  button:hover { background:#0056b3; }
  .result { margin-top:20px; font-size:18px; }
</style>
</head>
<body>
<h1>🔗 Custom URL Shortener</h1>
<input type="text" id="longUrl" placeholder="Enter your long URL here" size="50">
<button onclick="createShortUrl()">Shorten</button>
<div class="result" id="result"></div>

<script>
const BASEROW_API_URL = "https://api.baserow.io/api/database/rows/table/";  
const TABLE_ID = "728730";  // Replace with your Baserow table ID
const API_KEY = "jXXkrUUqrQK3RlESaDPs2gq0Eu0SK4Sw";

// === CREATE SHORT URL ===
async function createShortUrl() {
  const longUrl = document.getElementById("longUrl").value.trim();
  if (!longUrl) return alert("Please enter a valid URL");

  const shortCode = Math.random().toString(36).substring(2, 8);

  const res = await fetch(`${BASEROW_API_URL}${TABLE_ID}/`, {
    method: "POST",
    headers: {
      "Authorization": `Token ${API_KEY}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      field_6125355: longUrl,
      field_6125356: shortCode,
      field_6125422: 0
    })
  });

  if (res.ok) {
    const shortUrl = `${window.location.origin}/?r=${shortCode}`;
    document.getElementById("result").innerHTML = 
      `✅ Short URL: <a href="${shortUrl}" target="_blank">${shortUrl}</a>`;
  } else {
    alert("Error creating short link!");
  }
}

// === REDIRECT HANDLER ===
async function checkRedirect() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("r");
  if (code) {
    // Fetch all links from table
    const res = await fetch(`${BASEROW_API_URL}${TABLE_ID}/?user_field_names=true`, {
      headers: { "Authorization": `Token ${API_KEY}` }
    });
    const data = await res.json();
    const match = data.results.find(row => row.ShortCode === code);
    if (match) {
      // Update click count
      await fetch(`${BASEROW_API_URL}${TABLE_ID}/${match.id}/`, {
        method: "PATCH",
        headers: {
          "Authorization": `Token ${API_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          field_6125422: (match.Clicks || 0) + 1
        })
      });
      // Redirect
      window.location.href = match.LongURL;
    } else {
      document.body.innerHTML = "<h2>❌ Link not found</h2>";
    }
  }
}

checkRedirect();
</script>
</body>
</html>
