<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom URL Shortener</title>
<style>
  body {
    margin: 0;
    font-family: "Poppins", sans-serif;
    background: linear-gradient(135deg, #4f46e5, #3b82f6);
    color: white;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.5s;
  }
  #loading {
    position: fixed;
    top:0; left:0; width:100vw; height:100vh;
    background:white; z-index:9999; display:none;
  }
  .card {
    background: white;
    color: #111;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    width: 90%;
    max-width: 400px;
    text-align: center;
    animation: fadeIn 0.6s ease;
  }
  h1 {
    color: #3b82f6;
    margin-bottom: 20px;
  }
  input {
    width: 100%;
    padding: 10px;
    border: 2px solid #3b82f6;
    border-radius: 10px;
    outline: none;
    font-size: 16px;
  }
  button {
    margin-top: 15px;
    width: 100%;
    padding: 10px;
    background: #3b82f6;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
  }
  button:hover { background:#2563eb; }
  #output {
    margin-top: 20px;
    font-size: 17px;
    word-break: break-all;
  }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
</style>
</head>
<body>

<div id="loading"></div>

<div class="card" id="mainCard">
  <h1>🔗 URL Shortener</h1>
  <input type="url" id="longUrl" placeholder="Enter your long URL..." />
  <button onclick="shortenUrl()">Shorten</button>
  <div id="output"></div>
</div>

<script>
const API_KEY = "jXXkrUUqrQK3RlESaDPs2gq0Eu0SK4Sw";
const TABLE_ID = 728730;
const API_URL = `https://api.baserow.io/api/database/rows/table/${TABLE_ID}/`;

window.addEventListener("DOMContentLoaded", async () => {
  const path = window.location.pathname.replace("/", "").trim();
  if (path && path.length < 20) {
    document.getElementById("mainCard").style.display = "none";
    document.getElementById("loading").style.display = "block";
    await handleRedirect(path);
  }
});

async function handleRedirect(code) {
  try {
    const res = await fetch(`${API_URL}?user_field_names=true&filter__field_6125356__equal=${encodeURIComponent(code)}`, {
      headers: { Authorization: `Token ${API_KEY}` }
    });
    const data = await res.json();
    if (data.results && data.results.length > 0) {
      const row = data.results[0];
      const id = row.id;
      const longUrl = row.field_6125355;
      const clicks = (row.field_6125422 || 0) + 1;
      await fetch(`${API_URL}${id}/`, {
        method: "PATCH",
        headers: {
          "Authorization": `Token ${API_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ field_6125422: clicks })
      });
      window.location.href = longUrl;
    } else {
      document.body.innerHTML = "<h2 style='color:#111;'>❌ Invalid short link</h2>";
    }
  } catch (e) {
    document.body.innerHTML = "<h2 style='color:#111;'>Error occurred</h2>";
  }
}

async function shortenUrl() {
  const longUrl = document.getElementById("longUrl").value.trim();
  const output = document.getElementById("output");
  const loading = document.getElementById("loading");
  if (!longUrl) return alert("Please enter a URL");

  loading.style.display = "block";

  try {
    // Check existing
    const res = await fetch(`${API_URL}?user_field_names=true&filter__field_6125355__equal=${encodeURIComponent(longUrl)}`, {
      headers: { Authorization: `Token ${API_KEY}` }
    });
    const data = await res.json();

    if (data.results && data.results.length > 0) {
      const oldShort = data.results[0].field_6125356;
      loading.style.display = "none";
      output.innerHTML = `✅ Already shortened:<br><a href="${window.location.origin}/${oldShort}" target="_blank">${window.location.origin}/${oldShort}</a>`;
      return;
    }

    // New short code
    const shortCode = Math.random().toString(36).substring(2, 8);
    const create = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Authorization": `Token ${API_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        field_6125355: longUrl,
        field_6125356: shortCode,
        field_6125422: 0
      })
    });
    const result = await create.json();
    loading.style.display = "none";
    output.innerHTML = `✨ Shortened:<br><a href="${window.location.origin}/${shortCode}" target="_blank">${window.location.origin}/${shortCode}</a>`;
  } catch (err) {
    console.error(err);
    alert("Error shortening URL.");
    loading.style.display = "none";
  }
}
</script>
</body>
</html>
