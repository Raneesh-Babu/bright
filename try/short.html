<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Custom URL Shortener</title>
<style>
  body{margin:0;font-family:Poppins,system-ui,-apple-system,Segoe UI,Roboto;min-height:100vh;
    display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#4f46e5,#3b82f6);color:#fff}
  #loading{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#fff;z-index:9999;display:none}
  .card{background:#fff;color:#0b1220;padding:28px;border-radius:16px;box-shadow:0 12px 30px rgba(2,6,23,.24);
    width:92%;max-width:460px;text-align:center}
  h1{margin:0 0 14px;font-size:20px;color:#334155}
  input{width:100%;padding:12px;border-radius:10px;border:2px solid #3b82f6;font-size:15px;outline:none}
  button{margin-top:14px;width:100%;padding:12px;border-radius:10px;border:0;background:#3b82f6;color:#fff;font-size:15px;cursor:pointer}
  button:hover{background:#2563eb}
  #output{margin-top:16px;font-size:15px;word-break:break-all}
  .small{font-size:13px;color:#64748b}
</style>
</head>
<body>
  <div id="loading"></div>

  <div class="card" id="card">
    <h1>🔗 URL Shortener</h1>
    <input id="longUrl" type="url" placeholder="Enter a long URL (https://...)" />
    <button id="btnShort">Shorten</button>
    <div id="output" aria-live="polite"></div>
    <div class="small" style="margin-top:10px">If the URL already exists, you'll get the same short link.</div>
  </div>

<script>
/* ====== CONFIG (already set for your Baserow) ====== */
const API_KEY = "jXXkrUUqrQK3RlESaDPs2gq0Eu0SK4Sw";
const TABLE_ID = 728730;
const API_URL = `https://api.baserow.io/api/database/rows/table/${TABLE_ID}/`;

/* numeric field keys exactly as in your Baserow table */
const F_LONG = "field_6125355";
const F_SHORT = "field_6125356";
const F_CLICKS = "field_6125422";

/* elements */
const btn = document.getElementById("btnShort");
const out = document.getElementById("output");
const loadingDiv = document.getElementById("loading");
const card = document.getElementById("card");

btn.addEventListener("click", shortenUrl);

/* On load: if path looks like a short code (e.g. /abc123) handle redirect */
window.addEventListener("DOMContentLoaded", () => {
  // Extract path after hostname (remove leading /). For root or index.html => ''
  let path = window.location.pathname || "";
  path = path.replace(/^\/+|\/+$/g, ""); // trim leading/trailing slashes
  console.log("Detected path:", path, "search:", window.location.search);

  // If there's a query ?r=code prefer that (legacy support)
  const qs = new URLSearchParams(window.location.search);
  const qcode = qs.get("r");
  if (qcode) path = qcode;

  // Consider code valid if non-empty and reasonably short (< 100 chars)
  if (path && path.length <= 100) {
    // hide UI, show white loading screen
    card.style.display = "none";
    loadingDiv.style.display = "block";
    document.body.style.background = "#ffffff";
    handleRedirect(path);
  }
});

/* ===== Helper: show messages ===== */
function showOutput(html) {
  out.innerHTML = html;
}

/* ===== Shorten a URL (or return existing) ===== */
async function shortenUrl() {
  const longUrl = document.getElementById("longUrl").value.trim();
  if (!longUrl) { alert("Please enter a valid URL (include https://)"); return; }

  // show white loading
  loadingDiv.style.display = "block";

  try {
    // 1) Check if this long URL already exists (filter by numeric field)
    const filterUrl = `${API_URL}?filter__field_6125355__equal=${encodeURIComponent(longUrl)}&page_size=1`;
    console.log("Checking existing:", filterUrl);
    const checkRes = await fetch(filterUrl, { headers: { Authorization: `Token ${API_KEY}` }});
    if (!checkRes.ok) throw new Error("Check request failed: " + checkRes.status);
    const checkJson = await checkRes.json();
    if (checkJson.results && checkJson.results.length > 0) {
      // Existing row found — return its short code
      const row = checkJson.results[0];
      const oldShort = row[F_SHORT];
      console.log("Found existing row:", row);
      showOutput(`✅ Already shortened:<br><a href="${window.location.origin}/${oldShort}" target="_blank">${window.location.origin}/${oldShort}</a>`);
      loadingDiv.style.display = "none";
      return;
    }

    // 2) Create new row with random short code
    const shortCode = generateShortCode();
    const body = {};
    body[F_LONG] = longUrl;
    body[F_SHORT] = shortCode;
    body[F_CLICKS] = 0;

    console.log("Creating new row:", body);
    const createRes = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Authorization": `Token ${API_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    });
    if (!createRes.ok) {
      const txt = await createRes.text();
      throw new Error("Create failed: " + createRes.status + " " + txt);
    }
    const createJson = await createRes.json();
    console.log("Created:", createJson);

    showOutput(`✨ Shortened:<br><a href="${window.location.origin}/${shortCode}" target="_blank">${window.location.origin}/${shortCode}</a>`);
  } catch (err) {
    console.error(err);
    showOutput(`<span style="color:red">Error: ${escapeHtml(String(err))}</span>`);
  } finally {
    loadingDiv.style.display = "none";
  }
}

/* ===== Redirect logic ===== */
async function handleRedirect(code) {
  try {
    console.log("Redirect lookup for:", code);
    // Use filter on short code numeric field
    const url = `${API_URL}?filter__field_6125356__equal=${encodeURIComponent(code)}&page_size=1`;
    console.log("Fetch URL:", url);
    const res = await fetch(url, { headers: { Authorization: `Token ${API_KEY}` }});
    if (!res.ok) throw new Error("Lookup failed: " + res.status);
    const json = await res.json();
    console.log("Lookup result:", json);

    if (!json.results || json.results.length === 0) {
      // not found
      document.body.innerHTML = "<h2 style='color:#111;font-family:Poppins, sans-serif;'>❌ Invalid short link</h2>";
      return;
    }

    const row = json.results[0];
    const longUrl = row[F_LONG];
    const clicks = (row[F_CLICKS] || 0) + 1;
    const id = row.id;

    if (!longUrl) {
      console.warn("Long URL missing in row:", row);
      document.body.innerHTML = "<h2 style='color:#111;font-family:Poppins, sans-serif;'>❌ Target URL missing</h2>";
      return;
    }

    // update clicks
    console.log("Updating clicks to", clicks, "for id", id);
    await fetch(`${API_URL}${id}/`, {
      method: "PATCH",
      headers: {
        "Authorization": `Token ${API_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ [F_CLICKS]: clicks })
    });

    // perform the redirect
    window.location.href = longUrl;
  } catch (err) {
    console.error("Redirect error:", err);
    document.body.innerHTML = "<h2 style='color:#111;font-family:Poppins, sans-serif;'>⚠️ Error during redirect</h2>";
  }
}

/* ===== Utilities ===== */
function generateShortCode() {
  // 6-char friendly code; add prefix if you like
  return Math.random().toString(36).substring(2, 8);
}
function escapeHtml(s){ return s.replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }

</script>
</body>
</html>
