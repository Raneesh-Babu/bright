<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom URL Shortener</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  
  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
    text-align: center;
    padding: 20px;
    transition: opacity 0.3s;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .hidden { display: none; }
  
  .container {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    background: white;
    border-radius: 16px;
    padding: 30px 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    transition: transform 0.3s;
  }
  
  .container:hover {
    transform: translateY(-5px);
  }
  
  h1 { 
    color: #2d3748; 
    margin-bottom: 25px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: clamp(1.5rem, 4vw, 2rem);
  }
  
  .input-group {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-bottom: 20px;
  }
  
  @media (min-width: 576px) {
    .input-group {
      flex-direction: row;
    }
  }
  
  input { 
    flex: 1;
    padding: 14px 16px; 
    border-radius: 10px; 
    border: 2px solid #e2e8f0; 
    font-size: 16px; 
    transition: all 0.3s;
    width: 100%;
  }
  
  input:focus {
    outline: none;
    border-color: #4299e1;
    box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
  }
  
  button { 
    padding: 14px 24px; 
    font-size: 16px; 
    border: none; 
    background: #4299e1; 
    color: white; 
    border-radius: 10px; 
    cursor: pointer; 
    font-weight: 600;
    transition: all 0.3s;
    white-space: nowrap;
    width: 100%;
  }
  
  @media (min-width: 576px) {
    button {
      width: auto;
    }
  }
  
  button:hover { 
    background: #3182ce; 
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(66, 153, 225, 0.3);
  }
  
  button:disabled {
    background: #a0aec0;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }
  
  .result { 
    margin-top: 25px; 
    padding: 20px;
    border-radius: 10px;
    background: #f7fafc;
    border-left: 4px solid #4299e1;
    text-align: left;
    word-break: break-word;
  }
  
  .result h3 {
    margin-top: 0;
    color: #2d3748;
    font-size: clamp(1.1rem, 3vw, 1.3rem);
  }
  
  .result a {
    color: #4299e1;
    text-decoration: none;
    font-weight: 600;
    word-break: break-all;
    display: inline-block;
    margin-top: 8px;
  }
  
  .result a:hover {
    text-decoration: underline;
  }
  
  .stats {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 15px;
    color: #718096;
    font-size: 14px;
  }
  
  @media (min-width: 400px) {
    .stats {
      flex-direction: row;
      justify-content: space-between;
    }
  }
  
  .loader {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255,255,255,.3);
    border-radius: 50%;
    border-top-color: #fff;
    animation: spin 1s ease-in-out infinite;
    margin-right: 10px;
  }
  
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  
  .existing-url {
    background: #e6fffa;
    border-left-color: #38b2ac;
  }
  
  .new-url {
    background: #f0fff4;
    border-left-color: #48bb78;
  }
  
  .error {
    background: #fed7d7;
    border-left-color: #f56565;
  }
  
  /* Small screen adjustments */
  @media (max-width: 400px) {
    body {
      padding: 10px;
    }
    
    .container {
      padding: 20px 15px;
      border-radius: 12px;
    }
    
    input, button {
      padding: 12px 14px;
    }
    
    .result {
      padding: 15px;
    }
  }
  
  /* Large screen adjustments */
  @media (min-width: 768px) {
    .container {
      padding: 40px;
    }
  }
</style>
</head>
<body id="pageBody">
<div id="mainContent">
  <div class="container">
    <h1><span>🔗</span> Custom URL Shortener</h1>
    <div class="input-group">
      <input type="text" id="longUrl" placeholder="Enter your long URL" />
      <button id="shortenBtn" onclick="createShortUrl()">
        <span class="btn-text">Shorten</span>
      </button>
    </div>
    <div id="result" class="result hidden"></div>
  </div>
</div>

<script>
const TABLE_ID = "728730";
const BASEROW_API_URL = `https://api.baserow.io/api/database/rows/table/${TABLE_ID}/`;
const API_KEY = "jXXkrUUqrQK3RlESaDPs2gq0Eu0SK4Sw";

// === CREATE SHORT URL ===
async function createShortUrl() {
  const longUrl = document.getElementById("longUrl").value.trim();
  if (!longUrl) return alert("Please enter a valid URL");
  
  // Add URL protocol if missing
  const formattedUrl = longUrl.startsWith('http') ? longUrl : `https://${longUrl}`;
  
  // Show loading state
  const btn = document.getElementById("shortenBtn");
  const btnText = btn.querySelector('.btn-text');
  btnText.textContent = "Shortening...";
  btn.disabled = true;
  btn.insertAdjacentHTML('afterbegin', '<span class="loader"></span>');
  
  try {
    // First check if URL already exists
    const res = await fetch(`${BASEROW_API_URL}?user_field_names=true`, {
      headers: { "Authorization": `Token ${API_KEY}` }
    });
    const data = await res.json();
    
    // Look for existing URL
    const existingEntry = data.results.find(r => r.LongURL === formattedUrl);
    
    if (existingEntry) {
      // URL already exists, show the existing short URL
      const shortUrl = `${window.location.origin}${window.location.pathname}?r=${existingEntry.ShortCode}`;
      
      document.getElementById("result").innerHTML = `
        <div class="existing-url">
          <h3>✅ This URL already has a short link!</h3>
          <p><strong>Short URL:</strong> <a href="${shortUrl}" target="_blank">${shortUrl}</a></p>
          <div class="stats">
            <span>Created: ${new Date(existingEntry.Date).toLocaleDateString()}</span>
            <span>Clicks: ${existingEntry.Clicks || 0}</span>
          </div>
        </div>
      `;
    } else {
      // Create new short URL
      const shortCode = Math.random().toString(36).substring(2, 8);
      const currentDate = new Date().toISOString().split('T')[0]; // Format: YYYY-MM-DD
      
      const createRes = await fetch(BASEROW_API_URL, {
        method: "POST",
        headers: {
          "Authorization": `Token ${API_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          field_6125355: formattedUrl,  // LongURL
          field_6125356: shortCode,     // ShortCode
          field_6125422: 0,             // Clicks (initialize as number)
          field_6126294: currentDate    // Date
        })
      });

      if (!createRes.ok) {
        const err = await createRes.text();
        throw new Error(err);
      }

      const shortUrl = `${window.location.origin}${window.location.pathname}?r=${shortCode}`;
      document.getElementById("result").innerHTML = `
        <div class="new-url">
          <h3>✅ Short URL Created!</h3>
          <p><strong>Short URL:</strong> <a href="${shortUrl}" target="_blank">${shortUrl}</a></p>
          <div class="stats">
            <span>Created: ${new Date().toLocaleDateString()}</span>
            <span>Clicks: 0</span>
          </div>
        </div>
      `;
    }
    
    document.getElementById("result").classList.remove("hidden");
    
  } catch (err) {
    console.error(err);
    document.getElementById("result").innerHTML = `
      <div class="error">
        <h3>❌ Failed to create short URL</h3>
        <p>Please try again later.</p>
      </div>
    `;
    document.getElementById("result").classList.remove("hidden");
  } finally {
    // Reset button state
    btn.disabled = false;
    btnText.textContent = "Shorten";
    const loader = btn.querySelector('.loader');
    if (loader) loader.remove();
  }
}

// === REDIRECT HANDLER ===
async function checkRedirect() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("r");
  if (!code) return;

  // Hide everything and show blank screen
  document.getElementById("mainContent").classList.add("hidden");
  document.body.style.background = "#ffffff";
  document.body.innerHTML = ""; // Completely blank screen

  try {
    const res = await fetch(`${BASEROW_API_URL}?user_field_names=true`, {
      headers: { "Authorization": `Token ${API_KEY}` }
    });
    const data = await res.json();

    const match = data.results.find(r => r.ShortCode === code);
    if (!match) {
      // If no match found, show error after a brief delay
      setTimeout(() => {
        document.body.innerHTML = "<div style='display:flex;align-items:center;justify-content:center;height:100vh;'><h2>❌ Link not found</h2></div>";
      }, 500);
      return;
    }

    // Update click count - ensure it's treated as a number
    const currentClicks = parseInt(match.Clicks) || 0;
    const newClickCount = currentClicks + 1;
    
    await fetch(`${BASEROW_API_URL}${match.id}/`, {
      method: "PATCH",
      headers: {
        "Authorization": `Token ${API_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ 
        field_6125422: newClickCount  // Update Clicks field as number
      })
    });

    // Redirect to the original URL
    window.location.href = match.LongURL;
  } catch (err) {
    console.error(err);
    // Show error after a brief delay
    setTimeout(() => {
      document.body.innerHTML = "<div style='display:flex;align-items:center;justify-content:center;height:100vh;'><h2>⚠️ Error fetching data</h2></div>";
    }, 500);
  }
}

// Initialize the app
checkRedirect();
</script>
</body>
</html>
