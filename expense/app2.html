<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Manager - Expense Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #4f46e5;
            --primary-light: #6366f1;
            --income: #10b981;
            --expense: #ef4444;
            --warning: #f59e0b;
            --background: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        body {
            background-color: var(--background);
            color: var(--text);
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
        }

        /* App Container */
        .app-container {
            padding-bottom: 80px;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .header h1 {
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Navigation */
        .nav {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 500px;
            margin: 0 auto;
            background: var(--card);
            border-top: 1px solid var(--border);
            z-index: 100;
        }

        .nav-btn {
            padding: 12px;
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 0.8rem;
        }

        .nav-btn.active {
            color: var(--primary);
        }

        .nav-btn i {
            font-size: 1.2rem;
        }

        /* Main Content */
        .content {
            padding: 20px;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Cards */
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            border-top: 4px solid;
        }

        .stat-income {
            border-color: var(--income);
        }

        .stat-expense {
            border-color: var(--expense);
        }

        .stat-balance {
            border-color: var(--primary);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 700;
        }

        /* Filters */
        .filters {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 8px 0;
            margin-bottom: 16px;
            -webkit-overflow-scrolling: touch;
        }

        .filter-btn {
            padding: 8px 16px;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 20px;
            color: var(--text-light);
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* Transactions List */
        .transactions-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .transaction-item {
            display: flex;
            align-items: center;
            padding: 16px;
            background: var(--card);
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
        }

        .transaction-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 1.2rem;
        }

        .income-icon {
            background: rgba(16, 185, 129, 0.1);
            color: var(--income);
        }

        .expense-icon {
            background: rgba(239, 68, 68, 0.1);
            color: var(--expense);
        }

        .transaction-info {
            flex: 1;
        }

        .transaction-name {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .transaction-details {
            font-size: 0.85rem;
            color: var(--text-light);
            display: flex;
            gap: 12px;
        }

        .transaction-amount {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .amount-income {
            color: var(--income);
        }

        .amount-expense {
            color: var(--expense);
        }

        /* Forms */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text);
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background: white;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* Buttons */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-light);
        }

        .btn-success {
            background: var(--income);
            color: white;
        }

        .btn-danger {
            background: var(--expense);
            color: white;
        }

        .btn-block {
            width: 100%;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        /* Type Selector */
        .type-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .type-btn {
            padding: 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--card);
            color: var(--text);
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }

        .type-btn.active {
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.1);
            color: var(--primary);
        }

        /* Categories */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .category-card {
            padding: 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .category-card:hover {
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.05);
        }

        .category-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .category-name {
            font-weight: 600;
            flex: 1;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-light);
            cursor: pointer;
            padding: 4px;
        }

        /* Search */
        .search-box {
            position: relative;
            margin-bottom: 16px;
        }

        .search-input {
            width: 100%;
            padding: 12px 12px 12px 44px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-state p {
            font-size: 1rem;
        }

        /* Chart */
        .chart-container {
            height: 200px;
            margin-top: 16px;
        }

        /* Alert */
        .alert {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--card);
            border-left: 4px solid var(--primary);
            border-radius: 8px;
            padding: 16px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1001;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .alert.success {
            border-left-color: var(--income);
        }

        .alert.error {
            border-left-color: var(--expense);
        }

        .alert.warning {
            border-left-color: var(--warning);
        }

        /* Budget Progress */
        .budget-progress {
            margin: 20px 0;
        }

        .budget-item {
            margin-bottom: 16px;
        }

        .budget-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .budget-bar {
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .budget-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s;
        }

        .budget-fill.safe {
            background: var(--income);
        }

        .budget-fill.warning {
            background: var(--warning);
        }

        .budget-fill.danger {
            background: var(--expense);
        }

        /* Responsive */
        @media (max-width: 500px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .categories-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Alert Container -->
    <div id="alertContainer"></div>

    <!-- App Container -->
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <h1>
                <i class="fas fa-wallet"></i>
                Money Manager
            </h1>
        </header>

        <!-- Main Content -->
        <main class="content">
            <!-- Dashboard Section -->
            <section id="dashboard" class="section active">
                <!-- Quick Stats -->
                <div class="stats-grid">
                    <div class="stat-box stat-income">
                        <div class="stat-label">Income</div>
                        <div class="stat-value">₹<span id="totalIncome">0</span></div>
                    </div>
                    <div class="stat-box stat-expense">
                        <div class="stat-label">Expenses</div>
                        <div class="stat-value">₹<span id="totalExpense">0</span></div>
                    </div>
                    <div class="stat-box stat-balance">
                        <div class="stat-label">Balance</div>
                        <div class="stat-value">₹<span id="totalBalance">0</span></div>
                    </div>
                </div>

                <!-- Time Filters -->
                <div class="filters">
                    <button class="filter-btn active" onclick="setTimeFilter('month')">This Month</button>
                    <button class="filter-btn" onclick="setTimeFilter('week')">This Week</button>
                    <button class="filter-btn" onclick="setTimeFilter('today')">Today</button>
                    <button class="filter-btn" onclick="setTimeFilter('all')">All Time</button>
                </div>

                <!-- Search -->
                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" class="search-input" id="searchInput" placeholder="Search transactions..." oninput="searchTransactions()">
                </div>

                <!-- Category Filters -->
                <div class="filters" id="categoryFilters">
                    <button class="filter-btn active" onclick="setCategoryFilter('all')">All</button>
                </div>

                <!-- Budget Overview -->
                <div class="card">
                    <div class="card-title">
                        <span>Budget Overview</span>
                        <button class="btn btn-primary" onclick="showBudgetModal()" style="padding: 8px 16px;">
                            <i class="fas fa-cog"></i>
                        </button>
                    </div>
                    <div id="budgetOverview">
                        <div class="empty-state">
                            <i class="fas fa-chart-pie"></i>
                            <p>No budget set</p>
                        </div>
                    </div>
                </div>

                <!-- Recent Transactions -->
                <div class="card">
                    <div class="card-title">
                        <span>Recent Transactions</span>
                        <button class="btn btn-primary" onclick="showSection('transactions')" style="padding: 8px 16px;">
                            <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                    <div id="recentTransactions" class="transactions-list">
                        <div class="empty-state">
                            <i class="fas fa-receipt"></i>
                            <p>No transactions yet</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Transactions Section -->
            <section id="transactions" class="section">
                <div class="card">
                    <div class="card-title">
                        <span>All Transactions</span>
                        <button class="btn btn-primary" onclick="showAddTransactionModal()" style="padding: 8px 16px;">
                            <i class="fas fa-plus"></i> Add
                        </button>
                    </div>

                    <!-- Search -->
                    <div class="search-box">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" class="search-input" id="transactionSearch" placeholder="Search transactions..." oninput="searchAllTransactions()">
                    </div>

                    <!-- Filters -->
                    <div class="filters">
                        <button class="filter-btn active" onclick="filterTransactions('all')">All</button>
                        <button class="filter-btn" onclick="filterTransactions('income')">Income</button>
                        <button class="filter-btn" onclick="filterTransactions('expense')">Expense</button>
                    </div>

                    <div id="allTransactions" class="transactions-list">
                        <div class="empty-state">
                            <i class="fas fa-receipt"></i>
                            <p>No transactions yet</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Add Transaction Section -->
            <section id="add" class="section">
                <div class="card">
                    <div class="card-title">Add Transaction</div>
                    <form id="transactionForm">
                        <input type="hidden" id="editId">
                        
                        <!-- Type Selector -->
                        <div class="type-selector">
                            <button type="button" class="type-btn active" onclick="setTransactionType('income')">
                                <i class="fas fa-arrow-down"></i> Income
                            </button>
                            <button type="button" class="type-btn" onclick="setTransactionType('expense')">
                                <i class="fas fa-arrow-up"></i> Expense
                            </button>
                        </div>

                        <!-- Amount -->
                        <div class="form-group">
                            <label class="form-label">Amount (₹)</label>
                            <input type="number" id="amount" class="form-input" placeholder="Enter amount" required step="0.01" min="0">
                        </div>

                        <!-- Remark -->
                        <div class="form-group">
                            <label class="form-label">Remark</label>
                            <input type="text" id="remark" class="form-input" placeholder="Enter remark">
                        </div>

                        <!-- Category -->
                        <div class="form-group">
                            <label class="form-label">Category</label>
                            <select id="category" class="form-select" required>
                                <option value="">Select Category</option>
                            </select>
                        </div>

                        <!-- Date -->
                        <div class="form-group">
                            <label class="form-label">Date</label>
                            <input type="date" id="date" class="form-input" required>
                        </div>

                        <!-- Recurring -->
                        <div class="form-group">
                            <label class="form-label">
                                <input type="checkbox" id="isRecurring" onchange="toggleRecurringFields()">
                                Make this recurring
                            </label>
                            <div id="recurringFields" style="display: none; margin-top: 12px;">
                                <div class="form-row">
                                    <div>
                                        <select id="recurrenceType" class="form-input">
                                            <option value="monthly">Monthly</option>
                                            <option value="weekly">Weekly</option>
                                            <option value="daily">Daily</option>
                                        </select>
                                    </div>
                                    <div>
                                        <input type="date" id="recurrenceEndDate" class="form-input" placeholder="End date">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="btn-group">
                            <button type="submit" class="btn btn-primary btn-block">
                                <i class="fas fa-save"></i> Save
                            </button>
                            <button type="button" class="btn" onclick="resetTransactionForm()" style="background: var(--border);">
                                <i class="fas fa-redo"></i> Reset
                            </button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- Categories Section -->
            <section id="categories" class="section">
                <div class="card">
                    <div class="card-title">Manage Categories</div>
                    
                    <!-- Add Category -->
                    <div class="form-group">
                        <label class="form-label">Add New Category</label>
                        <div class="form-row">
                            <input type="text" id="newCategoryName" class="form-input" placeholder="Category name">
                            <select id="newCategoryType" class="form-input">
                                <option value="income">Income</option>
                                <option value="expense">Expense</option>
                            </select>
                        </div>
                        <button class="btn btn-primary btn-block" onclick="addCategory()" style="margin-top: 12px;">
                            <i class="fas fa-plus"></i> Add Category
                        </button>
                    </div>

                    <!-- Income Categories -->
                    <div class="form-group">
                        <label class="form-label">Income Categories</label>
                        <div id="incomeCategories" class="categories-grid">
                            <!-- Income categories will be loaded here -->
                        </div>
                    </div>

                    <!-- Expense Categories -->
                    <div class="form-group">
                        <label class="form-label">Expense Categories</label>
                        <div id="expenseCategories" class="categories-grid">
                            <!-- Expense categories will be loaded here -->
                        </div>
                    </div>
                </div>
            </section>

            <!-- Reports Section -->
            <section id="reports" class="section">
                <div class="card">
                    <div class="card-title">Reports</div>
                    
                    <div class="form-group">
                        <label class="form-label">Report Type</label>
                        <select id="reportType" class="form-select" onchange="generateReport()">
                            <option value="monthly">Monthly Report</option>
                            <option value="category">Category Report</option>
                            <option value="budget">Budget Report</option>
                        </select>
                    </div>

                    <div id="reportContent">
                        <div class="empty-state">
                            <i class="fas fa-chart-bar"></i>
                            <p>Select report type to generate</p>
                        </div>
                    </div>

                    <div class="btn-group" style="margin-top: 24px;">
                        <button class="btn btn-primary btn-block" onclick="exportData()">
                            <i class="fas fa-download"></i> Export Data
                        </button>
                        <button class="btn btn-danger" onclick="clearData()">
                            <i class="fas fa-trash"></i> Clear All
                        </button>
                    </div>
                </div>
            </section>
        </main>

        <!-- Navigation -->
        <nav class="nav">
            <button class="nav-btn active" onclick="showSection('dashboard')">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </button>
            <button class="nav-btn" onclick="showSection('transactions')">
                <i class="fas fa-exchange-alt"></i>
                <span>Transactions</span>
            </button>
            <button class="nav-btn" onclick="showSection('add')">
                <i class="fas fa-plus-circle"></i>
                <span>Add</span>
            </button>
            <button class="nav-btn" onclick="showSection('categories')">
                <i class="fas fa-tags"></i>
                <span>Categories</span>
            </button>
            <button class="nav-btn" onclick="showSection('reports')">
                <i class="fas fa-chart-pie"></i>
                <span>Reports</span>
            </button>
        </nav>
    </div>

    <!-- Modals -->
    <!-- Budget Modal -->
    <div id="budgetModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Budget Settings</div>
                <button class="modal-close" onclick="hideBudgetModal()">×</button>
            </div>
            <div class="form-group">
                <label class="form-label">Total Monthly Budget (₹)</label>
                <input type="number" id="totalBudget" class="form-input" placeholder="Enter total budget">
            </div>
            <div class="form-group">
                <label class="form-label">Category Budgets</label>
                <div id="categoryBudgetList">
                    <!-- Category budgets will be loaded here -->
                </div>
            </div>
            <button class="btn btn-primary btn-block" onclick="saveBudgetSettings()">
                <i class="fas fa-save"></i> Save Settings
            </button>
        </div>
    </div>

    <!-- Import File Input -->
    <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importData()">

    <script>
        // Initialize data
        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
        let categories = JSON.parse(localStorage.getItem('categories')) || [
            { id: 1, name: 'Salary', type: 'income', icon: 'fas fa-money-bill-wave' },

        function saveTransaction() {
            const id = document.getElementById('editId').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const remark = document.getElementById('remark').value.trim();
            const categoryId = parseInt(document.getElementById('category').value);
            const date = document.getElementById('date').value;
            const isRecurring = document.getElementById('isRecurring').checked;
            const recurrenceType = document.getElementById('recurrenceType').value;
            const recurrenceEndDate = document.getElementById('recurrenceEndDate').value;
            
            // Validation
            if (!amount || amount <= 0 || !categoryId || !date) {
                showAlert('Please fill all required fields', 'error');
                return;
            }
            
            let transaction;
            
            if (id) {
                // Update existing transaction
                const index = transactions.findIndex(t => t.id === parseInt(id));
                if (index !== -1) {
                    transaction = {
                        ...transactions[index],
                        type: currentTransactionType,
                        amount,
                        remark: remark || 'No remark',
                        categoryId,
                        date,
                        updatedAt: new Date().toISOString()
                    };
                    transactions[index] = transaction;
                }
            } else {
                // Create new transaction
                transaction = {
                    id: transactions.length > 0 ? Math.max(...transactions.map(t => t.id)) + 1 : 1,
                    type: currentTransactionType,
                    amount,
                    remark: remark || 'No remark',
                    categoryId,
                    date,
                    createdAt: new Date().toISOString()
                };
                
                // If recurring, save to recurring transactions
                if (isRecurring) {
                    const recurringTransaction = {
                        ...transaction,
                        recurrenceType,
                        recurrenceEndDate,
                        lastProcessed: date
                    };
                    recurringTransactions.push(recurringTransaction);
                    localStorage.setItem('recurringTransactions', JSON.stringify(recurringTransactions));
                }
                
                transactions.push(transaction);
            }
            
            // Save to localStorage
            localStorage.setItem('transactions', JSON.stringify(transactions));
            
            // Update UI
            loadTransactions();
            updateDashboard();
            resetTransactionForm();
            
            showAlert(`Transaction ${id ? 'updated' : 'added'} successfully`, 'success');
            showSection('transactions');
        }

        // Dashboard
        function updateDashboard() {
            const now = new Date();
            let filtered = [...transactions];
            
            // Apply time filter
            switch(currentFilter) {
                case 'today':
                    const today = now.toISOString().split('T')[0];
                    filtered = filtered.filter(t => t.date === today);
                    break;
                case 'week':
                    const startOfWeek = new Date(now.setDate(now.getDate() - now.getDay()));
                    filtered = filtered.filter(t => new Date(t.date) >= startOfWeek);
                    break;
                case 'month':
                    const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
                    filtered = filtered.filter(t => new Date(t.date) >= startOfMonth);
                    break;
                // 'all' - no filter
            }
            
            // Calculate totals
            const totalIncome = filtered
                .filter(t => t.type === 'income')
                .reduce((sum, t) => sum + t.amount, 0);
            
            const totalExpense = filtered
                .filter(t => t.type === 'expense')
                .reduce((sum, t) => sum + t.amount, 0);
            
            const totalBalance = totalIncome - totalExpense;
            
            // Update UI
            document.getElementById('totalIncome').textContent = totalIncome.toFixed(2);
            document.getElementById('totalExpense').textContent = totalExpense.toFixed(2);
            document.getElementById('totalBalance').textContent = totalBalance.toFixed(2);
            
            // Update budget overview
            updateBudgetOverview();
        }

        function updateBudgetOverview() {
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();
            
            // Get monthly expenses
            const monthlyExpenses = transactions.filter(t => {
                const date = new Date(t.date);
                return date.getMonth() === currentMonth && 
                       date.getFullYear() === currentYear && 
                       t.type === 'expense';
            });
            
            const totalExpenses = monthlyExpenses.reduce((sum, t) => sum + t.amount, 0);
            const totalBudget = budgets.total;
            
            const container = document.getElementById('budgetOverview');
            
            if (totalBudget === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-chart-pie"></i>
                        <p>No budget set</p>
                    </div>
                `;
                return;
            }
            
            const percentage = Math.min((totalExpenses / totalBudget) * 100, 100);
            let status = 'safe';
            let statusText = 'Under Budget';
            
            if (percentage >= 100) {
                status = 'danger';
                statusText = 'Over Budget';
            } else if (percentage >= 80) {
                status = 'warning';
                statusText = 'Near Limit';
            }
            
            container.innerHTML = `
                <div class="budget-progress">
                    <div class="budget-item">
                        <div class="budget-header">
                            <span>Total Budget</span>
                            <span>₹${totalExpenses.toFixed(2)} / ₹${totalBudget.toFixed(2)}</span>
                        </div>
                        <div class="budget-bar">
                            <div class="budget-fill ${status}" style="width: ${percentage}%;"></div>
                        </div>
                        <div style="text-align: center; margin-top: 8px; font-size: 0.9rem; color: var(--${status === 'safe' ? 'income' : status === 'warning' ? 'warning' : 'expense'});">
                            ${statusText} (${percentage.toFixed(1)}%)
                        </div>
                    </div>
                </div>
            `;
        }

        // Recurring Transactions
        function checkRecurringTransactions() {
            const today = new Date();
            const todayStr = today.toISOString().split('T')[0];
            
            recurringTransactions.forEach(rt => {
                const lastProcessed = new Date(rt.lastProcessed);
                const shouldProcess = shouldProcessRecurring(rt, lastProcessed, today);
                
                if (shouldProcess) {
                    // Create new transaction
                    const newTransaction = {
                        id: transactions.length > 0 ? Math.max(...transactions.map(t => t.id)) + 1 : 1,
                        type: rt.type,
                        amount: rt.amount,
                        remark: rt.remark + ' (Auto)',
                        categoryId: rt.categoryId,
                        date: todayStr,
                        createdAt: new Date().toISOString()
                    };
                    
                    transactions.push(newTransaction);
                    rt.lastProcessed = todayStr;
                }
            });
            
            // Save updates
            localStorage.setItem('transactions', JSON.stringify(transactions));
            localStorage.setItem('recurringTransactions', JSON.stringify(recurringTransactions));
        }

        function shouldProcessRecurring(rt, lastProcessed, today) {
            const diffTime = Math.abs(today - lastProcessed);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            switch(rt.recurrenceType) {
                case 'daily':
                    return diffDays >= 1;
                case 'weekly':
                    return diffDays >= 7;
                case 'monthly':
                    return today.getMonth() !== lastProcessed.getMonth() || today.getFullYear() !== lastProcessed.getFullYear();
                default:
                    return false;
            }
        }

        // Reports
        function generateReport() {
            const type = document.getElementById('reportType').value;
            const container = document.getElementById('reportContent');
            
            let html = '';
            
            if (type === 'monthly') {
                html = generateMonthlyReport();
            } else if (type === 'category') {
                html = generateCategoryReport();
            } else if (type === 'budget') {
                html = generateBudgetReport();
            }
            
            container.innerHTML = html;
        }

        function generateMonthlyReport() {
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();
            
            const monthlyTransactions = transactions.filter(t => {
                const date = new Date(t.date);
                return date.getMonth() === currentMonth && date.getFullYear() === currentYear;
            });
            
            const totalIncome = monthlyTransactions
                .filter(t => t.type === 'income')
                .reduce((sum, t) => sum + t.amount, 0);
            
            const totalExpense = monthlyTransactions
                .filter(t => t.type === 'expense')
                .reduce((sum, t) => sum + t.amount, 0);
            
            const balance = totalIncome - totalExpense;
            
            return `
                <div style="text-align: center; margin-bottom: 20px;">
                    <h3>${now.toLocaleString('default', { month: 'long', year: 'numeric' })}</h3>
                    <div class="stats-grid">
                        <div class="stat-box stat-income">
                            <div class="stat-label">Income</div>
                            <div class="stat-value">₹${totalIncome.toFixed(2)}</div>
                        </div>
                        <div class="stat-box stat-expense">
                            <div class="stat-label">Expenses</div>
                            <div class="stat-value">₹${totalExpense.toFixed(2)}</div>
                        </div>
                        <div class="stat-box stat-balance">
                            <div class="stat-label">Balance</div>
                            <div class="stat-value">₹${balance.toFixed(2)}</div>
                        </div>
                    </div>
                </div>
                <div style="max-height: 300px; overflow-y: auto;">
                    ${monthlyTransactions.map(t => {
                        const category = categories.find(c => c.id === t.categoryId);
                        return `
                            <div style="display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid var(--border);">
                                <div>
                                    <div style="font-weight: 600;">${category?.name || 'Uncategorized'}</div>
                                    <div style="font-size: 0.9rem; color: var(--text-light);">${formatDate(t.date)} - ${t.remark || ''}</div>
                                </div>
                                <div style="color: ${t.type === 'income' ? 'var(--income)' : 'var(--expense)'}; font-weight: 600;">
                                    ${t.type === 'income' ? '+' : '-'}₹${t.amount.toFixed(2)}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function generateCategoryReport() {
            const categoryTotals = {};
            
            categories.forEach(category => {
                categoryTotals[category.id] = {
                    name: category.name,
                    type: category.type,
                    total: 0
                };
            });
            
            transactions.forEach(t => {
                if (categoryTotals[t.categoryId]) {
                    categoryTotals[t.categoryId].total += t.amount;
                }
            });
            
            const categoriesWithData = Object.values(categoryTotals).filter(cat => cat.total > 0);
            
            return `
                <div style="max-height: 300px; overflow-y: auto;">
                    ${categoriesWithData.map(cat => {
                        const percentage = (cat.total / transactions.reduce((sum, t) => sum + t.amount, 0)) * 100;
                        return `
                            <div style="margin-bottom: 16px;">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                    <div style="display: flex; align-items: center; gap: 8px;">
                                        <div style="width: 12px; height: 12px; border-radius: 50%; background: ${cat.type === 'income' ? 'var(--income)' : 'var(--expense)'};"></div>
                                        <span style="font-weight: 600;">${cat.name}</span>
                                    </div>
                                    <span style="font-weight: 600; color: ${cat.type === 'income' ? 'var(--income)' : 'var(--expense)'}">
                                        ₹${cat.total.toFixed(2)}
                                    </span>
                                </div>
                                <div style="height: 8px; background: var(--border); border-radius: 4px; overflow: hidden;">
                                    <div style="height: 100%; width: ${percentage}%; background: ${cat.type === 'income' ? 'var(--income)' : 'var(--expense)'};"></div>
                                </div>
                                <div style="text-align: right; font-size: 0.85rem; color: var(--text-light); margin-top: 4px;">
                                    ${percentage.toFixed(1)}%
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function generateBudgetReport() {
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();
            
            const monthlyExpenses = transactions.filter(t => {
                const date = new Date(t.date);
                return date.getMonth() === currentMonth && 
                       date.getFullYear() === currentYear && 
                       t.type === 'expense';
            });
            
            const expensesByCategory = {};
            monthlyExpenses.forEach(t => {
                if (!expensesByCategory[t.categoryId]) {
                    expensesByCategory[t.categoryId] = 0;
                }
                expensesByCategory[t.categoryId] += t.amount;
            });
            
            const categoriesWithBudget = categories
                .filter(cat => cat.type === 'expense' && budgets.categories[cat.id])
                .map(cat => ({
                    ...cat,
                    budget: budgets.categories[cat.id],
                    actual: expensesByCategory[cat.id] || 0
                }));
            
            return `
                <div style="max-height: 300px; overflow-y: auto;">
                    ${categoriesWithBudget.map(cat => {
                        const percentage = cat.budget > 0 ? (cat.actual / cat.budget) * 100 : 0;
                        const status = percentage >= 100 ? 'danger' : percentage >= 80 ? 'warning' : 'safe';
                        const difference = cat.budget - cat.actual;
                        
                        return `
                            <div style="background: var(--border); padding: 12px; border-radius: 8px; margin-bottom: 8px;">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                    <div style="display: flex; align-items: center; gap: 8px;">
                                        <i class="${cat.icon}"></i>
                                        <span style="font-weight: 600;">${cat.name}</span>
                                    </div>
                                    <span style="color: ${difference >= 0 ? 'var(--income)' : 'var(--expense)'}; font-weight: 600;">
                                        ${difference >= 0 ? '+' : '-'}₹${Math.abs(difference).toFixed(2)}
                                    </span>
                                </div>
                                <div style="font-size: 0.9rem; color: var(--text-light); margin-bottom: 8px;">
                                    <span>Budget: ₹${cat.budget.toFixed(2)}</span> | 
                                    <span>Actual: ₹${cat.actual.toFixed(2)}</span>
                                </div>
                                <div style="height: 6px; background: white; border-radius: 3px; overflow: hidden;">
                                    <div class="budget-fill ${status}" style="width: ${Math.min(percentage, 100)}%;"></div>
                                </div>
                                <div style="text-align: center; font-size: 0.85rem; color: var(--text-light); margin-top: 4px;">
                                    ${percentage.toFixed(1)}%
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        // Data Import/Export
        function exportData() {
            const data = {
                transactions,
                categories,
                budgets,
                recurringTransactions,
                exportedAt: new Date().toISOString()
            };
            
            const dataStr = JSON.stringify(data, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `money-manager-backup-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            
            URL.revokeObjectURL(url);
            showAlert('Data exported successfully', 'success');
        }

        function importData() {
            document.getElementById('importFile').click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    
                    if (!data.transactions || !data.categories) {
                        throw new Error('Invalid data format');
                    }
                    
                    if (confirm('This will replace all your current data. Continue?')) {
                        transactions = data.transactions;
                        categories = data.categories;
                        budgets = data.budgets || budgets;
                        recurringTransactions = data.recurringTransactions || [];
                        
                        localStorage.setItem('transactions', JSON.stringify(transactions));
                        localStorage.setItem('categories', JSON.stringify(categories));
                        localStorage.setItem('budgets', JSON.stringify(budgets));
                        localStorage.setItem('recurringTransactions', JSON.stringify(recurringTransactions));
                        
                        // Reload UI
                        loadCategories();
                        loadTransactions();
                        loadAllTransactions();
                        updateDashboard();
                        updateCategoryFilters();
                        
                        showAlert('Data imported successfully', 'success');
                    }
                } catch (error) {
                    showAlert('Error importing data: ' + error.message, 'error');
                }
                
                event.target.value = '';
            };
            
            reader.readAsText(file);
        }

        function clearData() {
            if (confirm('Clear ALL data? This cannot be undone!')) {
                transactions = [];
                categories = [
                    { id: 1, name: 'Salary', type: 'income', icon: 'fas fa-money-bill-wave' },
                    { id: 2, name: 'Freelance', type: 'income', icon: 'fas fa-laptop-code' },
                    { id: 3, name: 'Investment', type: 'income', icon: 'fas fa-chart-line' },
                    { id: 4, name: 'Food', type: 'expense', icon: 'fas fa-utensils' },
                    { id: 5, name: 'Transport', type: 'expense', icon: 'fas fa-car' },
                    { id: 6, name: 'Shopping', type: 'expense', icon: 'fas fa-shopping-bag' },
                    { id: 7, name: 'Bills', type: 'expense', icon: 'fas fa-file-invoice' },
                    { id: 8, name: 'Entertainment', type: 'expense', icon: 'fas fa-film' }
                ];
                
                budgets = { total: 0, categories: {} };
                recurringTransactions = [];
                
                localStorage.setItem('transactions', JSON.stringify(transactions));
                localStorage.setItem('categories', JSON.stringify(categories));
                localStorage.setItem('budgets', JSON.stringify(budgets));
                localStorage.setItem('recurringTransactions', JSON.stringify(recurringTransactions));
                
                // Reload UI
                loadCategories();
                loadTransactions();
                loadAllTransactions();
                updateDashboard();
                updateCategoryFilters();
                
                showAlert('All data cleared', 'success');
            }
        }

        // Utility Functions
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const today = new Date();
            
            if (date.toDateString() === today.toDateString()) {
                return 'Today';
            }
            
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            
            if (date.toDateString() === yesterday.toDateString()) {
                return 'Yesterday';
            }
            
            return date.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
        }

        function showAlert(message, type = 'info') {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert ${type}`;
            alert.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
                <span>${message}</span>
            `;
            
            container.appendChild(alert);
            
            setTimeout(() => {
                alert.style.animation = 'slideIn 0.3s ease reverse';
                setTimeout(() => {
                    if (alert.parentNode) {
                        alert.parentNode.removeChild(alert);
                    }
                }, 300);
            }, 3000);
        }
    </script>
</body>
