<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lead Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
    
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #bae6fd 100%);
    }
    
    .form-container {
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      transition: all 0.3s ease;
    }
    
    .form-container:hover {
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
    }
    
    input, textarea, select {
      transition: all 0.3s ease;
      border-color: #bfdbfe;
    }
    
    input:focus, textarea:focus, select:focus {
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
      border-color: #3b82f6;
    }
    
    .submit-btn {
      transition: all 0.3s ease;
      background-image: linear-gradient(to right, #2563eb, #3b82f6);
      box-shadow: 0 4px 6px rgba(59, 130, 246, 0.3);
    }
    
    .submit-btn:hover:enabled {
      transform: translateY(-2px);
      box-shadow: 0 6px 8px rgba(59, 130, 246, 0.4);
    }
    
    .submit-btn:disabled {
      background-image: linear-gradient(to right, #9ca3af, #d1d5db);
      cursor: not-allowed;
      opacity: 0.7;
    }
    
    .success-message {
      animation: fadeInOut 4s ease-in-out;
    }
    
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateY(10px); }
      20% { opacity: 1; transform: translateY(0); }
      80% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(10px); }
    }
    
    .floating-label {
      position: relative;
    }
    
    .floating-label label {
      position: absolute;
      top: 12px;
      left: 12px;
      color: #6b7280;
      transition: all 0.2s ease;
      pointer-events: none;
      background: white;
      padding: 0 4px;
    }
    
    .floating-label input:focus + label,
    .floating-label input:not(:placeholder-shown) + label,
    .floating-label textarea:focus + label,
    .floating-label textarea:not(:placeholder-shown) + label,
    .floating-label select:focus + label,
    .floating-label select:not([value=""]) + label {
      top: -8px;
      left: 10px;
      font-size: 0.75rem;
      color: #3b82f6;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-6">

  <div class="form-container w-full max-w-2xl bg-white rounded-xl p-6 md:p-10">
    <h2 class="text-3xl font-bold text-center text-blue-700 mb-2">Lead Entry Form</h2>
    <p class="text-center text-gray-500 mb-8">Please fill in the details below</p>

    <form id="leadForm" class="space-y-6">
      <div class="floating-label">
        <input name="name" type="text" required placeholder=" " 
               class="w-full px-4 py-3 border-2 rounded-lg focus:ring-2 focus:ring-blue-500">
        <label>Name</label>
      </div>

      <div class="floating-label">
        <input name="mob" type="number" required placeholder=" "
               class="w-full px-4 py-3 border-2 rounded-lg focus:ring-2 focus:ring-blue-500">
        <label>Mobile</label>
      </div>

      <div class="floating-label">
        <textarea name="remark" rows="3" placeholder=" "
                  class="w-full px-4 py-3 border-2 rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
        <label>Remark</label>
      </div>

      <div class="floating-label">
        <select name="branch" required class="w-full px-4 py-3 border-2 rounded-lg focus:ring-2 focus:ring-blue-500">
          <option value=""></option>
          <option value="ANGADIPURAM">ANGADIPURAM</option>
          <option value="MANJERI">MANJERI</option>
        </select>
        <label>Branch</label>
      </div>

      <div class="floating-label">
        <input name="date" type="date" required 
               class="w-full px-4 py-3 border-2 rounded-lg focus:ring-2 focus:ring-blue-500">
        <label>Date</label>
      </div>

      <div class="floating-label">
        <input name="followup" type="date" 
               class="w-full px-4 py-3 border-2 rounded-lg focus:ring-2 focus:ring-blue-500">
        <label>Last Follow-up Date</label>
      </div>

      <div class="floating-label">
        <select name="status" required class="w-full px-4 py-3 border-2 rounded-lg focus:ring-2 focus:ring-blue-500">
          <option value=""></option>
          <option value="New Lead">New Lead</option>
          <option value="Followup Pending">Followup Pending</option>
          <option value="Followup done">Followup Done</option>
          <option value="Interested">Interested</option>
          <option value="Not Interested">Not Interested</option>
          <option value="Sale done">Sale done</option>
        </select>
        <label>Status</label>
      </div>

      <div class="text-center pt-6">
        <button id="submitBtn" type="submit" 
                class="submit-btn text-white px-8 py-3 rounded-lg font-semibold text-lg w-full md:w-auto">
          Submit
        </button>
      </div>
    </form>

    <div id="successMsg" class="success-message hidden text-green-600 text-center mt-6 font-medium text-lg">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 inline-block mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
      </svg>
      Lead submitted successfully!
    </div>
  </div>

  <script>
    const form = document.getElementById("leadForm");
    const successMsg = document.getElementById("successMsg");
    const submitBtn = document.getElementById("submitBtn");

    const BASEROW_API_TOKEN = "jXXkrUUqrQK3RlESaDPs2gq0Eu0SK4Sw";
    const TABLE_ID = "619130";

    // Replace these with your Baserow field IDs (get from API or GUI)
    const FIELD_IDS = {
      name: "field_5033844",
      mob: "field_5033845",
      remark: "field_5033846",
      branch: "field_5033847",
      date: "field_5033849",
      followup: "field_5033851",
      status: "field_5033852"
    };

    async function createRow() {
      const res = await fetch(`https://api.baserow.io/api/database/rows/table/${TABLE_ID}/`, {
        method: "POST",
        headers: {
          Authorization: `Token ${BASEROW_API_TOKEN}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({})
      });
      const data = await res.json();
      return data.id;
    }

    async function updateField(rowId, fieldName, value) {
      const payload = {};
      payload[FIELD_IDS[fieldName]] = value;

      await fetch(`https://api.baserow.io/api/database/rows/table/${TABLE_ID}/${rowId}/?user_field_names=false`, {
        method: "PATCH",
        headers: {
          Authorization: `Token ${BASEROW_API_TOKEN}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      // Disable the button
      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Processing...';

      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());

      try {
        const rowId = await createRow();

        // Upload each field one-by-one
        for (const key in data) {
          if (data[key]) {
            await updateField(rowId, key, data[key]);
          }
        }

        form.reset();
        successMsg.classList.remove("hidden");
        
        // Hide success message after 4 seconds
        setTimeout(() => {
          successMsg.classList.add("hidden");
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Submit';
        }, 4000);
      } catch (err) {
        alert("Error uploading to Baserow. Please try again.");
        console.error(err);
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Submit';
      }
    });
  </script>

</body>
</html>
