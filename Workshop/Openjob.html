<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Job Card Manager</title>
  <style>
    :root {
      --primary: #4361ee;
      --secondary: #3f37c9;
      --success: #4cc9f0;
      --danger: #f72585;
      --warning: #f8961e;
      --info: #4895ef;
      --light: #f8f9fa;
      --dark: #212529;
      --gray: #6c757d;
      --white: #ffffff;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.1);
      --shadow-md: 0 4px 6px rgba(0,0,0,0.1);
      --shadow-lg: 0 10px 15px rgba(0,0,0,0.1);
      --radius-sm: 0.25rem;
      --radius-md: 0.5rem;
      --radius-lg: 1rem;
      --transition: all 0.3s ease;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
      margin: 0;
      padding: 2rem;
      color: var(--dark);
      line-height: 1.6;
    }

    h2 {
      color: var(--primary);
      margin-bottom: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    #jobCardsContainer {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      transition: var(--transition);
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-lg);
    }

    .card-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: var(--white);
      padding: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      transition: var(--transition);
    }

    .card-header:hover {
      background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
    }

    .card-header span {
      font-size: 0.85rem;
      font-weight: 400;
      opacity: 0.9;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      overflow-y: auto;
      padding: 2rem;
      box-sizing: border-box;
    }

    .modal-content {
      background: var(--white);
      border-radius: var(--radius-lg);
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
      position: relative;
      animation: modalFadeIn 0.3s ease-out;
    }

    .close-modal {
      position: absolute;
      top: 1rem;
      right: 1rem;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--gray);
      background: none;
      border: none;
      padding: 0.5rem;
    }

    .close-modal:hover {
      color: var(--danger);
    }

    .modal-card-content {
      padding: 1rem 0;
    }

    .modal-card-content p {
      margin: 0.75rem 0;
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    .modal-card-content p:last-child {
      border-bottom: none;
    }

    .modal-card-content strong {
      color: var(--primary);
      font-weight: 600;
    }

    .modal-card-content label {
      display: block;
      margin: 1rem 0 0.5rem;
      font-weight: 600;
      color: var(--primary);
    }

    .modal-card-content textarea,
    .modal-card-content select {
      width: 100%;
      padding: 0.75rem;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(0,0,0,0.1);
      font-family: inherit;
      font-size: 0.95rem;
      transition: var(--transition);
      background: var(--light);
    }

    .modal-card-content textarea {
      min-height: 150px;
      resize: vertical;
    }

    .modal-card-content textarea:focus,
    .modal-card-content select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
    }

    .modal-start-btn {
      background: linear-gradient(135deg, var(--success) 0%, var(--info) 100%);
      color: var(--white);
      padding: 0.75rem;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      width: 100%;
      font-weight: 600;
      margin-top: 1.5rem;
      transition: var(--transition);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 0.9rem;
    }

    .modal-start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(76, 201, 240, 0.4);
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      body {
        padding: 1rem;
      }
      
      #jobCardsContainer {
        grid-template-columns: 1fr;
      }

      .modal {
        padding: 1rem;
      }

      .modal-content {
        padding: 1.5rem;
      }
    }

    @media (max-width: 480px) {
      .modal-content {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <h2>🛠️ Job Cards - Open</h2>
  <div id="jobCardsContainer"></div>

  <!-- Modal -->
  <div id="jobCardModal" class="modal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeModal()">&times;</button>
      <div id="modalContent" class="modal-card-content"></div>
    </div>
  </div>

  <script>
    const apiKey = "FoELccYGXhpK4LW4eHEuF2oeRqOnJt0f";
    const tableId = 622532;
    const technicians = ["Technician A", "Technician B", "Technician C"];
    let currentRowId = null;

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" });
    }

    function openModal(row) {
      currentRowId = row.id;
      const modal = document.getElementById("jobCardModal");
      const modalContent = document.getElementById("modalContent");

      modalContent.innerHTML = `
        <h3>${row["Job Card No"]} <span> | ${row["Service Type"]}</span></h3>
        <p><strong>Date:</strong> ${formatDate(row["Job Card Date"])}</p>
        <p><strong>Owner:</strong> ${row["Owner Name"]}</p>
        <p><strong>Mobile:</strong> ${row["Mobile"]}</p>
        <p><strong>VIN:</strong> ${row["VIN"]}</p>
        <p><strong>Remarks:</strong> ${row["Remarks"] || "N/A"}</p>
        <p><strong>Service Notes:</strong> ${row["Service Notes"] || "N/A"}</p>
        <p><strong>Technician For Inspection:</strong> ${row["Technician For Inspection"] || "N/A"}</p>
        <label><strong>Inspection Details:</strong></label>
        <textarea placeholder="Enter inspection bullet points..."></textarea>

        <label><strong>Select Service Technician:</strong></label>
        <select>
          <option value="">-- Select Technician --</option>
          ${technicians.map(tech => `<option value="${tech}">${tech}</option>`).join("")}
        </select>

        <button class="modal-start-btn" onclick="startMaintenance(currentRowId, this)">Start Maintenance</button>
      `;

      modal.style.display = "block";
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      const modal = document.getElementById("jobCardModal");
      modal.style.display = "none";
      document.body.style.overflow = "auto";
    }

    async function loadJobCards() {
      const res = await fetch(`https://api.baserow.io/api/database/rows/table/${tableId}/?user_field_names=true`, {
        headers: { Authorization: `Token ${apiKey}` }
      });
      const data = await res.json();

      const cards = data.results
        .filter(row => row["Service Status"] === "Job Card Open")
        .sort((a, b) => new Date(b["Job Card Date"]) - new Date(a["Job Card Date"]));

      const container = document.getElementById("jobCardsContainer");
      container.innerHTML = "";

      cards.forEach(row => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <div class="card-header" onclick="openModal(${JSON.stringify(row).replace(/"/g, '&quot;')})">
            <div>${row["Job Card No"]} <span> | ${row["Service Type"]}</span></div>
            <div>${formatDate(row["Job Card Date"])}</div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    async function startMaintenance(rowId, button) {
      const content = button.closest(".modal-card-content");
      const details = content.querySelector("textarea").value.trim();
      const technician = content.querySelector("select").value;

      if (!details || !technician) {
        alert("Please enter inspection details and select a technician.");
        return;
      }

      const now = new Date().toISOString();

      await fetch(`https://api.baserow.io/api/database/rows/table/${tableId}/${rowId}/?user_field_names=true`, {
        method: "PATCH",
        headers: {
          Authorization: `Token ${apiKey}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          "Inspection Details": details,
          "Service Status": "Work in Progress",
          "Service Technician": technician,
          "Inspection Done Date": now
        })
      });

      alert("Maintenance started and updated successfully.");
      closeModal();
      loadJobCards();
    }

    // Close modal when clicking outside content
    window.onclick = function(event) {
      const modal = document.getElementById("jobCardModal");
      if (event.target == modal) {
        closeModal();
      }
    }

    loadJobCards();
  </script>
</body>
</html>
