<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Job Card Manager</title>
  <style>
    :root {
      --primary: #4361ee;
      --secondary: #3f37c9;
      --success: #4cc9f0;
      --danger: #f72585;
      --warning: #f8961e;
      --info: #4895ef;
      --light: #f8f9fa;
      --dark: #212529;
      --gray: #6c757d;
      --white: #ffffff;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.1);
      --shadow-md: 0 4px 6px rgba(0,0,0,0.1);
      --shadow-lg: 0 10px 15px rgba(0,0,0,0.1);
      --radius-sm: 0.25rem;
      --radius-md: 0.5rem;
      --radius-lg: 1rem;
      --transition: all 0.3s ease;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
      margin: 0;
      padding: 2rem;
      color: var(--dark);
      line-height: 1.6;
    }

    h2 {
      color: var(--primary);
      margin-bottom: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    #jobCardsContainer {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-lg);
    }

    .card-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: var(--white);
      padding: 1rem 1.25rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .card-header:hover {
      background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
    }

    .card-header > div {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .card-header span {
      font-size: 0.8rem;
      font-weight: 400;
      opacity: 0.9;
      display: inline-block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }

    .card-header div:last-child {
      font-size: 0.85rem;
      text-align: right;
      white-space: nowrap;
      margin-left: 0.5rem;
    }

    .card-content {
      display: none;
      padding: 1.25rem;
      animation: fadeIn 0.3s ease-in-out;
      background: var(--white);
      border-top: 1px solid rgba(0,0,0,0.05);
      flex-grow: 1;
      box-sizing: border-box;
    }

    .card-content p {
      margin: 0.5rem 0;
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(0,0,0,0.05);
      font-size: 0.9rem;
      word-break: break-word;
    }

    .card-content p:last-child {
      border-bottom: none;
    }

    .card-content strong {
      color: var(--primary);
      font-weight: 600;
      display: inline-block;
      min-width: 120px;
    }

    .card-content label {
      display: block;
      margin: 0.75rem 0 0.25rem;
      font-weight: 600;
      color: var(--primary);
      font-size: 0.9rem;
    }

    .card-content textarea,
    .card-content select {
      width: calc(100% - 1.5rem);
      padding: 0.6rem 0.75rem;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(0,0,0,0.1);
      font-family: inherit;
      font-size: 0.9rem;
      transition: var(--transition);
      background: var(--light);
      box-sizing: border-box;
    }

    .card-content textarea {
      min-height: 80px;
      resize: vertical;
    }

    .card-content textarea:focus,
    .card-content select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
    }

    .start-btn {
      background: linear-gradient(135deg, var(--success) 0%, var(--info) 100%);
      color: var(--white);
      padding: 0.7rem;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      width: 100%;
      font-weight: 600;
      margin-top: 1rem;
      transition: var(--transition);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 0.85rem;
      box-sizing: border-box;
    }

    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(76, 201, 240, 0.4);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      body {
        padding: 1rem;
      }
      
      #jobCardsContainer {
        grid-template-columns: 1fr;
      }

      .card-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
      }

      .card-header div:last-child {
        text-align: left;
        margin-left: 0;
      }

      .card-header span {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="jobCardsContainer"></div>

  <script>
    const apiKey = "FoELccYGXhpK4LW4eHEuF2oeRqOnJt0f";
    const tableId = 622532;
    const technicians = ["Technician A", "Technician B", "Technician C"];

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" });
    }

    async function loadJobCards() {
      const res = await fetch(`https://api.baserow.io/api/database/rows/table/${tableId}/?user_field_names=true`, {
        headers: { Authorization: `Token ${apiKey}` }
      });
      const data = await res.json();

      const cards = data.results
        .filter(row => row["Service Status"] === "Job Card Open")
        .sort((a, b) => new Date(b["Job Card Date"]) - new Date(a["Job Card Date"]));

      const container = document.getElementById("jobCardsContainer");
      container.innerHTML = "";

      cards.forEach(row => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <div class="card-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'block' ? 'none' : 'block'">
            <div>${row["Job Card No"]} <span> | ${row["Service Type"]}</span></div>
            <div>${formatDate(row["Job Card Date"])}</div>
          </div>
          <div class="card-content">
            <p><strong>Owner:</strong> ${row["Owner Name"]}</p>
            <p><strong>Mobile:</strong> ${row["Mobile"]}</p>
            <p><strong>VIN:</strong> ${row["VIN"]}</p>
            <p><strong>Remarks:</strong> ${row["Remarks"] || ""}</p>
            <p><strong>Service Notes:</strong> ${row["Service Notes"] || ""}</p>
            <p><strong>Technician For Inspection:</strong> ${row["Technician For Inspection"] || "N/A"}</p>
            <label><strong>Inspection Details:</strong></label>
            <textarea placeholder="Enter inspection bullet points..."></textarea>

            <label><strong>Select Service Technician:</strong></label>
            <select>
              <option value="">-- Select Technician --</option>
              ${technicians.map(tech => `<option value="${tech}">${tech}</option>`).join("")}
            </select>

            <button class="start-btn" onclick="startMaintenance(${row.id}, this)">Start Maintenance</button>
          </div>
        `;

        container.appendChild(card);
      });
    }

    async function startMaintenance(rowId, button) {
      const content = button.closest(".card-content");
      const details = content.querySelector("textarea").value.trim();
      const technician = content.querySelector("select").value;

      if (!details || !technician) {
        alert("Please enter inspection details and select a technician.");
        return;
      }

      const now = new Date().toISOString();

      await fetch(`https://api.baserow.io/api/database/rows/table/${tableId}/${rowId}/?user_field_names=true`, {
        method: "PATCH",
        headers: {
          Authorization: `Token ${apiKey}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          "Inspection Details": details,
          "Service Status": "Work in Progress",
          "Service Technician": technician,
          "Inspection Done Date": now
        })
      });

      alert("Maintenance started and updated successfully.");
      loadJobCards();
    }

    loadJobCards();
  </script>
</body>
</html>
