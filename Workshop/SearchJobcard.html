<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Delivery Completed Job Cards</title>
  <style>
    :root {
      --primary-color: #4361ee;
      --secondary-color: #3f37c9;
      --accent-color: #4895ef;
      --light-color: #f8f9fa;
      --dark-color: #212529;
      --success-color: #4cc9f0;
      --warning-color: #f8961e;
      --danger-color: #f72585;
      --border-radius: 12px;
      --box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      --transition: all 0.3s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
      margin: 0;
      padding: 2rem;
      min-height: 100vh;
      color: var(--dark-color);
    }

    h2 {
      text-align: center;
      margin-bottom: 2rem;
      color: var(--secondary-color);
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      position: relative;
      padding-bottom: 0.5rem;
    }

    h2::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 4px;
      background: var(--accent-color);
      border-radius: 2px;
    }

    .filter-container {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 2rem;
      max-width: 1000px;
      margin-left: auto;
      margin-right: auto;
    }

    .filter-container input {
      padding: 0.8rem 1.2rem;
      border: 2px solid #e9ecef;
      border-radius: var(--border-radius);
      font-size: 0.95rem;
      transition: var(--transition);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .filter-container input:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(72, 149, 239, 0.2);
    }

    #jobCardsContainer {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: white;
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
      overflow: hidden;
      transition: var(--transition);
      border: 1px solid rgba(0, 0, 0, 0.05);
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      cursor: pointer;
      padding: 1.5rem;
      background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
      color: white;
      transition: var(--transition);
    }

    .card-header:hover {
      background: linear-gradient(135deg, #3a0ca3 0%, #4361ee 100%);
    }

    .card-header div {
      margin-bottom: 0.5rem;
      flex: 1 1 50%;
    }

    .card-header strong {
      font-size: 1.1rem;
      font-weight: 600;
      display: inline-block;
      margin-right: 0.5rem;
      color: rgba(255, 255, 255, 0.9);
    }

    .card-header div {
      font-size: 0.95rem;
    }

    .card-details {
      padding: 1.5rem;
      display: none;
      background: white;
    }

    .owner-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      padding: 1rem;
      border-radius: var(--border-radius);
      border-left: 4px solid var(--accent-color);
    }

    .field-box {
      margin-bottom: 1.2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #f1f3f5;
    }

    .field-box:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .field-box label {
      font-weight: 600;
      color: var(--secondary-color);
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      letter-spacing: 0.3px;
    }

    .field-box div {
      background: var(--light-color);
      padding: 0.8rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #495057;
    }

    .owner-info .field-box {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .owner-info label {
      color: var(--primary-color);
      font-size: 0.85rem;
    }

    .owner-info div {
      background: white;
      font-weight: 600;
      color: var(--dark-color);
    }

    ul {
      padding-left: 1.5rem;
      list-style-type: none;
    }

    ul li {
      position: relative;
      padding-left: 1.5rem;
      margin-bottom: 0.5rem;
    }

    ul li::before {
      content: '•';
      position: absolute;
      left: 0;
      color: var(--accent-color);
      font-weight: bold;
      font-size: 1.2rem;
    }

    @media (max-width: 768px) {
      body {
        padding: 1rem;
      }

      #jobCardsContainer {
        grid-template-columns: 1fr;
      }

      .card-header div {
        flex: 1 1 100%;
      }

      .filter-container {
        flex-direction: column;
      }

      .filter-container input {
        width: 100%;
      }

      .owner-info {
        grid-template-columns: 1fr;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-details[style*="block"] {
      animation: fadeIn 0.3s ease-out forwards;
    }

    .rating-stars {
      color: #ffc107;
      letter-spacing: 2px;
      font-size: 1.3rem;
    }

    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 600;
      background-color: #4bb543;
      color: white;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="filter-container">
    <input type="date" id="fromDate" placeholder="From Date">
    <input type="date" id="toDate" placeholder="To Date">
    <input type="text" id="searchInput" placeholder="Search Job Card No">
  </div>

  <div id="jobCardsContainer"></div>

  <script>
    const API_KEY = "FoELccYGXhpK4LW4eHEuF2oeRqOnJt0f";
    const TABLE_ID = 622532;
    const API_URL = `https://api.baserow.io/api/database/rows/table/${TABLE_ID}/?user_field_names=true`;

    async function fetchData() {
      const res = await fetch(API_URL, {
        headers: { Authorization: `Token ${API_KEY}` }
      });
      const data = await res.json();
      return data.results.filter(row => row["Service Status"] === "Delivery Completed");
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
    }

    function toBullets(text) {
      return text
        ? `<ul>${text.split('\n').map(line => `<li>${line.trim()}</li>`).join('')}</ul>`
        : '';
    }

    function renderRating(rating) {
      const filled = '★'.repeat(rating || 0);
      const empty = '☆'.repeat(5 - (rating || 0));
      return `<span class="rating-stars">${filled}${empty}</span>`;
    }

    function createCard(row) {
      const card = document.createElement('div');
      card.className = 'card';

      card.innerHTML = `
        <div class="card-header">
          <div><strong>Job Card No:</strong> ${row["Job Card No"] || '-'}</div>
          <div><strong>Job Card Date:</strong> ${formatDate(row["Job Card Date"])}</div>
          <div><strong>Status:</strong> <span class="status-badge">${row["Service Status"]}</span></div>
          <div><strong>Closed Date:</strong> ${formatDate(row["Job Card Closed Date"])}</div>
        </div>
        <div class="card-details">
          <div class="owner-info">
            <div class="field-box">
              <label>Owner Name</label>
              <div>${row["Owner Name"] || '-'}</div>
            </div>
            <div class="field-box">
              <label>Mobile</label>
              <div>${row["Mobile"] || '-'}</div>
            </div>
          </div>
          ${generateField("Service Type", row["Service Type"])}
          ${generateField("Service Notes", row["Service Notes"])}
          ${generateField("VIN", row["VIN"])}
          ${generateField("Technician For Inspection", row["Technician For Inspection"])}
          ${generateField("Remarks", row["Remarks"])}
          ${generateField("Inspection Details", toBullets(row["Inspection Details"]))}
          ${generateField("Inspection Done Date", formatDate(row["Inspection Done Date"]))}
          ${generateField("Service Technician", row["Service Technician"])}
          ${generateField("Parts Used", toBullets(row["Parts Used"]))}
          ${generateField("Labour Hour", row["Labour Hour"])}
          ${generateField("Quoted Cost", row["Quoted Cost"])}
          ${generateField("Maintenance Performed", toBullets(row["Maintenance Performed"]))}
          ${generateField("Service Done Date", formatDate(row["Service Done Date"]))}
          ${generateField("Parts Verification", row["Parts Verification"])}
          ${generateField("Invoice Generation", row["Invoice Generation"])}
          ${generateField("Final Service Amount", row["Final Service Amount"])}
          ${generateField("Service Rating", renderRating(row["Service Rating"]))}
          ${generateField("Vehicle Delivery Date", formatDate(row["Vehicle Delivery Date"]))}
        </div>
      `;

      card.querySelector('.card-header').addEventListener('click', () => {
        const details = card.querySelector('.card-details');
        details.style.display = details.style.display === 'block' ? 'none' : 'block';
      });

      return card;
    }

    function generateField(label, value) {
      return value
        ? `<div class="field-box">
             <label>${label}</label>
             <div>${value}</div>
           </div>`
        : '';
    }

    function renderCards(data) {
      const container = document.getElementById('jobCardsContainer');
      container.innerHTML = '';
      data.forEach(row => container.appendChild(createCard(row)));
    }

    function applyFilters(data) {
      const from = new Date(document.getElementById('fromDate').value || '1900-01-01');
      const to = new Date(document.getElementById('toDate').value || '3000-01-01');
      const search = document.getElementById('searchInput').value.toLowerCase();

      return data.filter(row => {
        const jobDate = new Date(row["Job Card Date"]);
        const matchDate = jobDate >= from && jobDate <= to;
        const matchSearch = row["Job Card No"]?.toLowerCase().includes(search);
        return matchDate && matchSearch;
      });
    }

    async function init() {
      const allData = await fetchData();
      renderCards(applyFilters(allData));

      document.getElementById('fromDate').addEventListener('change', () => renderCards(applyFilters(allData)));
      document.getElementById('toDate').addEventListener('change', () => renderCards(applyFilters(allData)));
      document.getElementById('searchInput').addEventListener('input', () => renderCards(applyFilters(allData)));
    }

    init();
  </script>
</body>
</html>
