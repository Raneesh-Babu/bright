<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Scooter Registration</title>
    <style>
        :root {
            --primary: #1e88e5;
            --primary-dark: #1565c0;
            --primary-light: #64b5f6;
            --secondary: #42a5f5;
            --danger: #e53935;
            --dark: #0d47a1;
            --light: #e3f2fd;
            --gray: #90a4ae;
            --shadow: 0 4px 6px rgba(30, 136, 229, 0.2);
            --transition: all 0.3s ease;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--dark);
            line-height: 1.6;
        }
        
        .container {
            width: 100%;
            max-width: 550px;
            margin: 20px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            border: 1px solid var(--primary-light);
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }
        
        h1 {
            text-align: center;
            color: var(--dark);
            margin-bottom: 25px;
            font-weight: 600;
            font-size: 28px;
            position: relative;
            padding-bottom: 10px;
        }
        
        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: var(--primary);
            border-radius: 3px;
        }
        
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--dark);
            font-size: 14px;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #bbdefb;
            border-radius: 8px;
            font-size: 15px;
            transition: var(--transition);
            background-color: #f5fafd;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.2);
            background-color: white;
        }
        
        .vehicle-id-display {
            font-size: 20px;
            font-weight: 600;
            color: var(--primary-dark);
            padding: 15px;
            background-color: rgba(30, 136, 229, 0.1);
            border-radius: 8px;
            text-align: center;
            margin-bottom: 25px;
            border: 1px dashed var(--primary);
            transition: var(--transition);
        }
        
        .vehicle-id-display:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
            background-color: rgba(30, 136, 229, 0.15);
        }
        
        .scan-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            margin-top: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        
        .scan-btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }
        
        .btn-submit, .btn-clear {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
            font-weight: 500;
            transition: var(--transition);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        
        .btn-submit {
            background-color: var(--primary);
            color: white;
        }
        
        .btn-submit:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        
        .btn-clear {
            background-color: var(--danger);
            color: white;
        }
        
        .btn-clear:hover {
            background-color: #c62828;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(229, 57, 53, 0.2);
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
        }
        
        .btn-group button {
            flex: 1;
        }
        
        /* Floating animation for the container */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        
        .container {
            animation: float 6s ease-in-out infinite;
        }
        
        /* Responsive adjustments */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
                margin: 15px;
            }
            
            h1 {
                font-size: 24px;
            }
        }
        
        /* Loading spinner for submit button */
        .spinner {
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            display: none;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Blue-themed select dropdown arrow */
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231e88e5'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="vehicleIdDisplay" class="vehicle-id-display">
            Vehicle ID will be generated after validation
        </div>
        <form id="registrationForm">
            <!-- Owner Details -->
            <div class="form-group">
                <label for="ownerName">Owner Name*</label>
                <input type="text" id="ownerName" required>
            </div>
            
            <div class="form-group">
                <label for="mobile">Mobile Number*</label>
                <input type="tel" id="mobile" pattern="[0-9]{10}" required>
            </div>
            
            <!-- Vehicle Details -->
            <div class="form-group">
                <label for="vin">VIN (17 characters)*</label>
                <input type="text" id="vin" minlength="10" maxlength="17" required>
            </div>
            
            <div class="form-group">
                <label for="motorNumber">Motor Number*</label>
                <input type="text" id="motorNumber" required>
            </div>
            
            <div class="form-group">
                <label for="makeModel">Make/Model*</label>
                <select id="makeModel" required>
                    <option value="">-- Select --</option>
                    <option value="Ola S1 Pro">Ola S1 Pro</option>
                    <option value="Ather 450X">Ather 450X</option>
                    <option value="TVS iQube">TVS iQube</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="purchaseDate">Purchase Date*</label>
                <input type="date" id="purchaseDate" required>
            </div>
            
            <!-- Optional Fields -->
            <div class="form-group">
                <label for="remarks">Remarks</label>
                <textarea id="remarks" rows="2" placeholder="Any special notes..."></textarea>
            </div>
            
            <!-- Hidden Vehicle ID Field -->
            <input type="hidden" id="vehicleId">
            
            <!-- Buttons -->
            <button type="submit" class="btn-submit" id="submitBtn">
                <span class="spinner" id="submitSpinner"></span>
                Register Scooter
            </button>
            <button type="reset" class="btn-clear">Clear Form</button>
        </form>
    </div>

    <script>
        const BASEROW_API_URL = "https://api.baserow.io/api/database/rows/table/622473/?user_field_names=true";
        const BASEROW_TOKEN = "FoELccYGXhpK4LW4eHEuF2oeRqOnJt0f";
        let latestVehicleId = 0;

        // Fetch the latest Vehicle ID when page loads
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                const response = await fetch(`${BASEROW_API_URL}&order_by=-Vehicle ID`, {
                    headers: {
                        "Authorization": `Token ${BASEROW_TOKEN}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.results.length > 0) {
                        const latestId = data.results[0]["Vehicle ID"] || "BVEH000";
                        const num = parseInt(latestId.replace("BVEH", ""));
                        latestVehicleId = isNaN(num) ? 0 : num;
                        updateVehicleIdDisplay();
                    }
                }
            } catch (error) {
                console.error("Error fetching latest ID:", error);
            }
        });

        function generateVehicleId() {
            latestVehicleId++;
            return `BVEH${latestVehicleId.toString().padStart(3, '0')}`;
        }

        function updateVehicleIdDisplay() {
            const nextId = generateVehicleId();
            document.getElementById('vehicleIdDisplay').textContent = `Vehicle ID: ${nextId}`;
            document.getElementById('vehicleId').value = nextId;
        }

        async function registerScooter(formData) {
            try {
                // First verify the VIN doesn't already exist
                
                // Add the generated Vehicle ID to the form data
                formData["Vehicle ID"] = document.getElementById('vehicleId').value;
                
                const response = await fetch(BASEROW_API_URL, {
                    method: "POST",
                    headers: {
                        "Authorization": `Token ${BASEROW_TOKEN}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(formData)
                });
                
                if (!response.ok) throw new Error("Registration failed");
                return await response.json();
            } catch (error) {
                console.error("API Error:", error);
                throw error;
            }
        }

        document.getElementById('registrationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const spinner = document.getElementById('submitSpinner');
            
            submitBtn.disabled = true;
            spinner.style.display = 'inline-block';
            
            const formData = {
                "Owner Name": document.getElementById('ownerName').value,
                "Mobile": document.getElementById('mobile').value,
                "VIN": document.getElementById('vin').value,
                "Motor Number": document.getElementById('motorNumber').value,
                "Make/Model": document.getElementById('makeModel').value,
                "Purchase Date": document.getElementById('purchaseDate').value,
                "Remarks": document.getElementById('remarks').value
            };
            
            try {
                const result = await registerScooter(formData);
                alert(`Registration Successful!\nVehicle ID: ${document.getElementById('vehicleId').value}\nVIN: ${formData.VIN}`);
                this.reset();
                updateVehicleIdDisplay(); // Generate new ID for next registration
            } catch (error) {
                alert(`Registration failed: ${error.message}`);
            } finally {
                submitBtn.disabled = false;
                spinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
