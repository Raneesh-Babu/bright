<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Maintenance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #6C63FF;
            --secondary: #4D44DB;
            --accent: #FF6584;
            --light: #F8F9FF;
            --dark: #2D3748;
            --success: #4ADE80;
            --warning: #FBBF24;
            --danger: #F87171;
            --info: #60A5FA;
            --gradient: linear-gradient(135deg, var(--primary), var(--secondary));
            --card-gradient: linear-gradient(to bottom right, #FFFFFF, #F0F4FF);
            --border-radius: 16px;
            --box-shadow: 0 10px 30px rgba(108, 99, 255, 0.2);
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--light);
            color: var(--dark);
            line-height: 1.7;
            background-image: radial-gradient(circle at 10% 20%, rgba(108, 99, 255, 0.05) 0%, rgba(108, 99, 255, 0.05) 90%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            padding: 2.5rem 1.5rem;
        }

        h1, h2, h3, h4, h5, h6 {
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 2.5rem;
            position: relative;
            color: var(--secondary);
            text-align: center;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            padding: 0 1rem;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 5px;
            background: var(--gradient);
            border-radius: 5px;
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: var(--primary);
            position: relative;
            display: inline-block;
            padding-bottom: 0.5rem;
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50px;
            height: 4px;
            background: var(--accent);
            border-radius: 2px;
        }

        .card {
            margin-bottom: 25px;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--box-shadow);
            background: var(--card-gradient);
            position: relative;
            border: 1px solid rgba(108, 99, 255, 0.1);
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 15px 40px rgba(108, 99, 255, 0.3);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 100%;
            background: var(--gradient);
        }

        .card-body {
            padding: 2rem;
        }

        .card-title {
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 1.2rem;
            font-size: 1.3rem;
        }

        .card-text {
            margin-bottom: 0.8rem;
            color: var(--dark);
            font-size: 0.95rem;
        }

        .card-text strong {
            color: var(--primary);
            font-weight: 600;
        }

        .technician-list {
            display: none;
            margin-top: 15px;
        }

        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 4rem 2rem;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            margin: 3rem 0;
            border: 1px solid rgba(108, 99, 255, 0.1);
        }

        .loading p {
            margin-top: 1.5rem;
            color: var(--primary);
            font-weight: 500;
        }

        .spinner {
            width: 3.5rem;
            height: 3.5rem;
            color: var(--primary);
        }

        .error-message {
            color: var(--danger);
            margin-top: 15px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .alert {
            border-radius: var(--border-radius);
            padding: 1.2rem 1.5rem;
            border: none;
            box-shadow: var(--box-shadow);
        }

        .alert-info {
            background-color: rgba(96, 165, 250, 0.15);
            color: var(--info);
            border-left: 4px solid var(--info);
        }

        .alert-danger {
            background-color: rgba(248, 113, 113, 0.15);
            color: var(--danger);
            border-left: 4px solid var(--danger);
        }

        .alert-success {
            background-color: rgba(74, 222, 128, 0.15);
            color: var(--success);
            border-left: 4px solid var(--success);
        }

        .btn {
            border-radius: 50px;
            padding: 0.7rem 2rem;
            font-weight: 600;
            transition: var(--transition);
            letter-spacing: 0.5px;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0));
            opacity: 0;
            transition: var(--transition);
        }

        .btn:hover::after {
            opacity: 1;
        }

        .btn-primary {
            background: var(--gradient);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(108, 99, 255, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(to right, #6B7280, #4B5563);
            color: white;
        }

        .btn-secondary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(75, 85, 99, 0.3);
            background: linear-gradient(to right, #5B6472, #3B4553);
        }

        .form-select, .form-control {
            border-radius: 50px;
            padding: 0.7rem 1.5rem;
            border: 1px solid rgba(108, 99, 255, 0.2);
            transition: var(--transition);
            background-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 2px 10px rgba(108, 99, 255, 0.05);
        }

        .form-select:focus, .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 0.25rem rgba(255, 101, 132, 0.25);
        }

        #jobDetailView .card {
            box-shadow: 0 15px 40px rgba(108, 99, 255, 0.2);
            background: white;
        }

        #jobDetailView .card-title {
            font-size: 1.7rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(108, 99, 255, 0.1);
            color: var(--secondary);
        }

        #jobDetailView p {
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        #jobDetailView strong {
            color: var(--primary);
            min-width: 140px;
            display: inline-block;
            font-weight: 600;
        }

        #jobDetailView .form-label {
            font-weight: 600;
            color: var(--secondary);
            margin-bottom: 0.8rem;
        }

        /* Notification styles */
        .notification-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            max-width: 350px;
        }

        .notification {
            padding: 1.2rem 1.5rem;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            transform: translateX(120%);
            transition: transform 0.3s ease-out;
            background: white;
            border-left: 5px solid var(--success);
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification-icon {
            margin-right: 1rem;
            font-size: 1.5rem;
            color: var(--success);
        }

        .notification-content {
            flex: 1;
        }

        .notification-title {
            font-weight: 600;
            margin-bottom: 0.3rem;
            color: var(--dark);
        }

        .notification-message {
            color: var(--dark);
            font-size: 0.9rem;
        }

        .notification-close {
            margin-left: 1rem;
            cursor: pointer;
            color: var(--dark);
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .notification-close:hover {
            opacity: 1;
        }

        /* Animated background elements */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(108, 99, 255, 0.05) 0%, transparent 70%);
            z-index: -1;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -50%;
            left: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 101, 132, 0.05) 0%, transparent 70%);
            z-index: -1;
        }

        /* Responsive adjustments */
        @media (max-width: 992px) {
            .container {
                padding: 2rem 1rem;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            h2 {
                font-size: 1.7rem;
            }
            
            .card-body {
                padding: 1.5rem;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
                margin-bottom: 2rem;
            }
            
            h2 {
                font-size: 1.5rem;
            }
            
            .card-body {
                padding: 1.2rem;
            }
            
            .btn {
                padding: 0.6rem 1.5rem;
            }

            .notification-container {
                max-width: 280px;
                right: 10px;
                top: 10px;
            }
        }

        @media (max-width: 576px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .container {
                padding: 1.5rem 1rem;
            }
            
            .loading {
                padding: 3rem 1rem;
            }
        }

        /* Animation for cards when loaded */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }
        .card:nth-child(4) { animation-delay: 0.4s; }
        .card:nth-child(5) { animation-delay: 0.5s; }
        .card:nth-child(6) { animation-delay: 0.6s; }
    </style>
</head>
<body>
    <!-- Notification Container -->
    <div class="notification-container" id="notificationContainer"></div>

    <div class="container py-4">
        <div id="scheduledJobsView">
            <div id="loadingIndicator" class="loading">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p>Loading scheduled services...</p>
            </div>
            <div id="noJobsMessage" class="alert alert-info hidden">
                No scheduled services found.
            </div>
            <div id="errorMessage" class="alert alert-danger hidden">
                Failed to load scheduled services. Please try again.
            </div>
            <div id="jobsContainer" class="row"></div>
        </div>

        <div id="jobDetailView" class="hidden">
            <button id="backButton" class="btn btn-secondary mb-3">← Back</button>
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Service Details</h5>
                    <p><strong>VIN:</strong> <span id="detailVin"></span></p>
                    <p><strong>Service Type:</strong> <span id="detailServiceType"></span></p>
                    <p><strong>Service Date:</strong> <span id="detailServiceDate"></span></p>
                    <p><strong>Status:</strong> <span id="detailStatus"></span></p>
                    <p><strong>Remarks:</strong> <span id="detailRemarks"></span></p>
                    <p><strong>Service Notes:</strong> <span id="detailServiceNotes"></span></p>
                    
                    <div class="mb-3">
                        <label for="technicianSelect" class="form-label">Select Technician:</label>
                        <select id="technicianSelect" class="form-select">
                            <option value="">Select a technician</option>
                            <option value="John Smith">John Smith</option>
                            <option value="Sarah Johnson">Sarah Johnson</option>
                            <option value="Michael Brown">Michael Brown</option>
                            <option value="Emily Davis">Emily Davis</option>
                            <option value="Robert Wilson">Robert Wilson</option>
                        </select>
                    </div>
                    
                    <button id="openJobCardBtn" class="btn btn-primary" disabled>Open Job Card</button>
                    <div id="updateError" class="error-message hidden"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Configuration
        const config = {
            vehicleTableId: 622473,
            maintenanceTableId: 622532,
            apiKey: 'FoELccYGXhpK4LW4eHEuF2oeRqOnJt0f',
            apiUrl: 'https://api.baserow.io/api/database/rows/table/'
        };

        // DOM Elements
        const jobsContainer = document.getElementById('jobsContainer');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const noJobsMessage = document.getElementById('noJobsMessage');
        const errorMessage = document.getElementById('errorMessage');
        const scheduledJobsView = document.getElementById('scheduledJobsView');
        const jobDetailView = document.getElementById('jobDetailView');
        const backButton = document.getElementById('backButton');
        const openJobCardBtn = document.getElementById('openJobCardBtn');
        const technicianSelect = document.getElementById('technicianSelect');
        const updateError = document.getElementById('updateError');
        const notificationContainer = document.getElementById('notificationContainer');

        // State
        let scheduledJobs = [];
        let currentJobId = null;
        let nextJobCardNumber = 'BSJ001';

        // Initialize the app
        document.addEventListener('DOMContentLoaded', async () => {
            await fetchScheduledJobs();
            setupEventListeners();
        });

        // Event Listeners
        function setupEventListeners() {
            backButton.addEventListener('click', () => {
                jobDetailView.classList.add('hidden');
                scheduledJobsView.classList.remove('hidden');
            });

            technicianSelect.addEventListener('change', (e) => {
                openJobCardBtn.disabled = !e.target.value;
            });

            openJobCardBtn.addEventListener('click', async () => {
                if (!currentJobId || !technicianSelect.value) return;
                
                try {
                    openJobCardBtn.disabled = true;
                    openJobCardBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Processing...';
                    updateError.classList.add('hidden');
                    
                    await updateJobCard(currentJobId, {
                        'Service Status': 'Job Card Open',
                        'Technician': technicianSelect.value,
                        'Job Card Date': new Date().toISOString(),
                        'Job Card No': nextJobCardNumber
                    });
                    
                    // Show success notification
                    showNotification(
                        'Job Card Created',
                        `Job card ${nextJobCardNumber} has been successfully opened and assigned to ${technicianSelect.value}.`,
                        'success'
                    );
                    
                    // Increment job card number for next use
                    const num = parseInt(nextJobCardNumber.replace('BSJ', ''));
                    nextJobCardNumber = 'BSJ' + String(num + 1).padStart(3, '0');
                    
                    // Refresh the list
                    await fetchScheduledJobs();
                    jobDetailView.classList.add('hidden');
                    scheduledJobsView.classList.remove('hidden');
                } catch (error) {
                    console.error('Error opening job card:', error);
                    updateError.textContent = 'Failed to open job card. Please try again.';
                    updateError.classList.remove('hidden');
                } finally {
                    openJobCardBtn.disabled = false;
                    openJobCardBtn.textContent = 'Open Job Card';
                }
            });
        }

        // Show notification function
        function showNotification(title, message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `
                <div class="notification-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                </div>
                <div class="notification-content">
                    <div class="notification-title">${title}</div>
                    <div class="notification-message">${message}</div>
                </div>
                <div class="notification-close">&times;</div>
            `;
            
            notificationContainer.appendChild(notification);
            
            // Trigger the show animation
            setTimeout(() => {
                notification.classList.add('show');
            }, 10);
            
            // Auto-remove after 5 seconds
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => {
                    notification.remove();
                }, 300);
            }, 5000);
            
            // Close button functionality
            notification.querySelector('.notification-close').addEventListener('click', () => {
                notification.classList.remove('show');
                setTimeout(() => {
                    notification.remove();
                }, 300);
            });
        }

        // Fetch scheduled jobs
        async function fetchScheduledJobs() {
            try {
                loadingIndicator.classList.remove('hidden');
                noJobsMessage.classList.add('hidden');
                errorMessage.classList.add('hidden');
                jobsContainer.innerHTML = '';
                
                // First, fetch all rows to check the actual field names
                const testResponse = await fetch(`${config.apiUrl}${config.maintenanceTableId}/?user_field_names=true&size=1`, {
                    headers: {
                        'Authorization': `Token ${config.apiKey}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!testResponse.ok) throw new Error('Failed to fetch test data');
                
                const testData = await testResponse.json();
                if (testData.results.length === 0) {
                    noJobsMessage.classList.remove('hidden');
                    return;
                }
                
                // Get the first result to inspect field names
                const sampleJob = testData.results[0];
                const statusFieldName = Object.keys(sampleJob).find(key => 
                    key.toLowerCase().includes('status') || 
                    (sampleJob[key] && ['Scheduled', 'Job Card Open'].includes(sampleJob[key]))
                );
                
                if (!statusFieldName) {
                    throw new Error('Could not determine status field name');
                }
                
                // Now fetch only scheduled jobs using the correct field name
                const filterQuery = `filter__${statusFieldName}__equal=Scheduled`;
                const response = await fetch(`${config.apiUrl}${config.maintenanceTableId}/?user_field_names=true&${filterQuery}`, {
                    headers: {
                        'Authorization': `Token ${config.apiKey}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) throw new Error('Failed to fetch scheduled jobs');
                
                const data = await response.json();
                scheduledJobs = data.results;
                
                // Determine next job card number
                await determineNextJobCardNumber();
                
                if (scheduledJobs.length === 0) {
                    noJobsMessage.classList.remove('hidden');
                } else {
                    renderScheduledJobs(scheduledJobs);
                }
            } catch (error) {
                console.error('Error fetching scheduled jobs:', error);
                errorMessage.classList.remove('hidden');
            } finally {
                loadingIndicator.classList.add('hidden');
            }
        }

        // Determine the next job card number
        async function determineNextJobCardNumber() {
            try {
                const response = await fetch(`${config.apiUrl}${config.maintenanceTableId}/?user_field_names=true&size=200`, {
                    headers: {
                        'Authorization': `Token ${config.apiKey}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) throw new Error('Failed to fetch job cards');
                
                const data = await response.json();
                const jobCardField = Object.keys(data.results[0] || {}).find(key => 
                    key.toLowerCase().includes('job card no') ||
                    (data.results[0][key] && data.results[0][key].toString().startsWith('BSJ'))
                );
                
                if (!jobCardField) {
                    nextJobCardNumber = 'BSJ001';
                    return;
                }
                
                const jobCards = data.results.filter(job => job[jobCardField] && job[jobCardField].toString().startsWith('BSJ'));
                
                if (jobCards.length > 0) {
                    const numbers = jobCards.map(job => {
                        const numStr = job[jobCardField].toString().replace('BSJ', '');
                        return parseInt(numStr) || 0;
                    });
                    
                    const maxNumber = Math.max(...numbers);
                    nextJobCardNumber = 'BSJ' + String(maxNumber + 1).padStart(3, '0');
                } else {
                    nextJobCardNumber = 'BSJ001';
                }
            } catch (error) {
                console.error('Error determining next job card number:', error);
                // Fallback to simple increment if API fails
                nextJobCardNumber = 'BSJ001';
            }
        }

        // Render scheduled jobs
        function renderScheduledJobs(jobs) {
            jobsContainer.innerHTML = '';
            
            jobs.forEach(job => {
                // Find field names dynamically
                const vinField = Object.keys(job).find(key => key.toLowerCase().includes('vin'));
                const serviceTypeField = Object.keys(job).find(key => key.toLowerCase().includes('service type'));
                const serviceDateField = Object.keys(job).find(key => key.toLowerCase().includes('service date'));
                const statusField = Object.keys(job).find(key => key.toLowerCase().includes('status'));
                const remarksField = Object.keys(job).find(key => key.toLowerCase().includes('remarks'));
                
                const card = document.createElement('div');
                card.className = 'col-md-6 col-lg-4';
                card.innerHTML = `
                    <div class="card" data-job-id="${job.id}">
                        <div class="card-body">
                            <h5 class="card-title">${serviceTypeField ? job[serviceTypeField] : 'Service'}</h5>
                            <p class="card-text"><strong>VIN:</strong> ${vinField ? job[vinField] : 'N/A'}</p>
                            <p class="card-text"><strong>Date:</strong> ${serviceDateField ? formatDate(job[serviceDateField]) : 'N/A'}</p>
                            <p class="card-text"><strong>Status:</strong> ${statusField ? job[statusField] : 'N/A'}</p>
                            <p class="card-text"><strong>Remarks:</strong> ${remarksField ? job[remarksField] : 'None'}</p>
                        </div>
                    </div>
                `;
                
                card.querySelector('.card').addEventListener('click', () => showJobDetails(job.id));
                jobsContainer.appendChild(card);
            });
        }

        // Show job details
        function showJobDetails(jobId) {
            const job = scheduledJobs.find(j => j.id === jobId);
            if (!job) return;
            
            currentJobId = jobId;
            
            // Find field names dynamically
            const vinField = Object.keys(job).find(key => key.toLowerCase().includes('vin'));
            const serviceTypeField = Object.keys(job).find(key => key.toLowerCase().includes('service type'));
            const serviceDateField = Object.keys(job).find(key => key.toLowerCase().includes('service date'));
            const statusField = Object.keys(job).find(key => key.toLowerCase().includes('status'));
            const remarksField = Object.keys(job).find(key => key.toLowerCase().includes('remarks'));
            const serviceNotesField = Object.keys(job).find(key => key.toLowerCase().includes('service notes'));
            
            document.getElementById('detailVin').textContent = vinField ? job[vinField] : 'N/A';
            document.getElementById('detailServiceType').textContent = serviceTypeField ? job[serviceTypeField] : 'N/A';
            document.getElementById('detailServiceDate').textContent = serviceDateField ? formatDate(job[serviceDateField]) : 'N/A';
            document.getElementById('detailStatus').textContent = statusField ? job[statusField] : 'N/A';
            document.getElementById('detailRemarks').textContent = remarksField ? job[remarksField] : 'None';
            document.getElementById('detailServiceNotes').textContent = serviceNotesField ? job[serviceNotesField] : 'None';
            
            // Reset technician selection
            technicianSelect.value = '';
            openJobCardBtn.disabled = true;
            updateError.classList.add('hidden');
            
            scheduledJobsView.classList.add('hidden');
            jobDetailView.classList.remove('hidden');
        }

        // Update job card
        async function updateJobCard(jobId, updates) {
            // First get the job to determine field names
            const getResponse = await fetch(`${config.apiUrl}${config.maintenanceTableId}/${jobId}/?user_field_names=true`, {
                headers: {
                    'Authorization': `Token ${config.apiKey}`,
                    'Content-Type': 'application/json'
                }
            });
            
            if (!getResponse.ok) throw new Error('Failed to get job details');
            
            const job = await getResponse.json();
            
            // Map our updates to the correct field names
            const mappedUpdates = {};
            for (const [key, value] of Object.entries(updates)) {
                const fieldName = Object.keys(job).find(field => 
                    field.toLowerCase().includes(key.toLowerCase())
                );
                if (fieldName) {
                    mappedUpdates[fieldName] = value;
                }
            }
            
            const response = await fetch(`${config.apiUrl}${config.maintenanceTableId}/${jobId}/?user_field_names=true`, {
                method: 'PATCH',
                headers: {
                    'Authorization': `Token ${config.apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(mappedUpdates)
            });
            
            if (!response.ok) throw new Error('Failed to update job card');
            return await response.json();
        }

        // Helper function to format date
        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            try {
                const date = new Date(dateString);
                return isNaN(date.getTime()) ? dateString : date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
            } catch (e) {
                return dateString;
            }
        }
    </script>
