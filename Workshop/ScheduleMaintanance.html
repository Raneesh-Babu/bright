<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Scheduling</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary: #4361ee;
            --primary-light: #4895ef;
            --secondary: #3f37c9;
            --success: #4cc9f0;
            --light: #f8f9fa;
            --dark: #212529;
            --gray: #6c757d;
            --light-gray: #e9ecef;
            --white: #ffffff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --border-radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f7fa;
            color: var(--dark);
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        h1, h2, h3 {
            color: var(--primary);
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 2rem;
            color: var(--secondary);
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 500;
            border-bottom: 2px solid var(--light-gray);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--dark);
        }

        input, select, textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--light-gray);
            border-radius: var(--border-radius);
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(67, 97, 238, 0.2);
        }

        .search-input {
            position: relative;
        }

        .search-input i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
        }

        .search-input input {
            padding-left: 3rem;
        }

        button {
            background-color: var(--primary);
            color: var(--white);
            border: none;
            border-radius: var(--border-radius);
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            background-color: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        button i {
            margin-right: 0.5rem;
        }

        .btn-block {
            display: block;
            width: 100%;
        }

        .vehicle-info {
            background-color: rgba(67, 97, 238, 0.05);
            border-left: 4px solid var(--primary);
            padding: 1.5rem;
            border-radius: var(--border-radius);
            margin-bottom: 2rem;
            display: none;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }

        .info-item {
            margin-bottom: 0.5rem;
        }

        .info-label {
            font-weight: 500;
            color: var(--gray);
            font-size: 0.9rem;
        }

        .info-value {
            font-weight: 600;
            color: var(--dark);
        }

        #searchResults {
            margin-top: 1.5rem;
        }

        .vehicle-result {
            padding: 1rem;
            border-bottom: 1px solid var(--light-gray);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
        }

        .vehicle-result:hover {
            background-color: var(--light);
            transform: translateX(5px);
        }

        .vehicle-icon {
            background-color: var(--primary-light);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
            flex-shrink: 0;
        }

        .vehicle-details {
            flex-grow: 1;
        }

        .vehicle-make {
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 0.25rem;
        }

        .vehicle-owner {
            color: var(--gray);
            font-size: 0.9rem;
        }

        .service-form {
            display: none;
        }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            background-color: var(--success);
            color: white;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 1rem;
            }
            
            .card {
                padding: 1.5rem;
            }
            
            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2><i class="fas fa-search"></i> Search Vehicle</h2>
            <div class="form-group search-input">
                <i class="fas fa-search"></i>
                <input type="text" id="searchTerm" placeholder="Enter VIN, Vehicle ID, or Phone Number">
            </div>
            <button id="searchButton" class="btn-block"><i class="fas fa-search"></i> Search Vehicle</button>
            <div id="searchResults"></div>
        </div>
        
        <div id="vehicleInfo" class="card vehicle-info">
            <h2><i class="fas fa-car"></i> Vehicle Information</h2>
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">Owner Name</div>
                    <div class="info-value" id="ownerName"></div>
                </div>
                <div class="info-item">
                    <div class="info-label">Mobile</div>
                    <div class="info-value" id="mobile"></div>
                </div>
                <div class="info-item">
                    <div class="info-label">Make/Model</div>
                    <div class="info-value" id="makeModel"></div>
                </div>
                <div class="info-item">
                    <div class="info-label">VIN</div>
                    <div class="info-value" id="vin"></div>
                </div>
            </div>
        </div>
        
        <div id="serviceForm" class="card service-form">
            <h2><i class="fas fa-calendar-alt"></i> Schedule Maintenance</h2>
            <form id="maintenanceForm">
                <input type="hidden" id="vehicleId">
                <input type="hidden" id="vinNumber">
                <input type="hidden" id="ownerNameField">
                <input type="hidden" id="mobileField">
                <input type="hidden" id="makeModelField">
                <input type="hidden" id="remarksField">
                
                <div class="form-group">
                    <label for="serviceDate"><i class="far fa-calendar-alt"></i> Service Date</label>
                    <input type="date" id="serviceDate" required>
                </div>
                
                <div class="form-group">
                    <label for="serviceType"><i class="fas fa-tools"></i> Service Type</label>
                    <select id="serviceType" required>
                        <option value="">Select service type</option>
                        <option value="Oil Change">FREE SERVICE</option>
                        <option value="Tire Rotation">PAID SERVICE</option>
                        <option value="Brake Service">MOTOR ISSUE</option>
                        <option value="Engine Tune-up">BATTERY ISSUE</option>
                        <option value="Transmission Service">WARRANTY SERVICE</option>
                        <option value="Other">BRAKE ISSUE</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="serviceNotice"><i class="far fa-comment-dots"></i> Service Notice</label>
                    <textarea id="serviceNotice" rows="4" placeholder="Any special instructions or notes..."></textarea>
                </div>
                
                <input type="hidden" id="serviceStatus" value="Scheduled">
                
                <button type="submit" class="btn-block"><i class="fas fa-calendar-check"></i> Schedule Maintenance</button>
            </form>
        </div>
    </div>

    <script>
        const API_KEY = 'FoELccYGXhpK4LW4eHEuF2oeRqOnJt0f';
        const VEHICLE_TABLE_ID = '622473';
        const MAINTENANCE_TABLE_ID = '622532';
        
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('searchButton').addEventListener('click', searchVehicle);
            document.getElementById('maintenanceForm').addEventListener('submit', scheduleMaintenance);
            
            // Set minimum date to today
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('serviceDate').min = today;
        });
        
        async function searchVehicle() {
            const searchTerm = document.getElementById('searchTerm').value.trim();
            if (!searchTerm) {
                showAlert('Please enter a search term', 'error');
                return;
            }
            
            try {
                showLoader(true);
                
                // Search in Vehicle table
                const response = await fetch(`https://api.baserow.io/api/database/rows/table/${VEHICLE_TABLE_ID}/?user_field_names=true&search=${encodeURIComponent(searchTerm)}`, {
                    headers: {
                        'Authorization': `Token ${API_KEY}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                
                const data = await response.json();
                displaySearchResults(data.results);
                
            } catch (error) {
                console.error('Error searching vehicles:', error);
                showAlert('Error searching vehicles. Please try again.', 'error');
            } finally {
                showLoader(false);
            }
        }
        
        function displaySearchResults(vehicles) {
            const resultsContainer = document.getElementById('searchResults');
            resultsContainer.innerHTML = '';
            
            if (vehicles.length === 0) {
                resultsContainer.innerHTML = `
                    <div style="text-align: center; padding: 1rem; color: var(--gray);">
                        <i class="fas fa-exclamation-circle" style="font-size: 2rem; margin-bottom: 1rem;"></i>
                        <p>No vehicles found matching your search.</p>
                    </div>
                `;
                return;
            }
            
            vehicles.forEach(vehicle => {
                const vehicleElement = document.createElement('div');
                vehicleElement.className = 'vehicle-result';
                vehicleElement.innerHTML = `
                    <div class="vehicle-icon">
                        <i class="fas fa-car"></i>
                    </div>
                    <div class="vehicle-details">
                        <div class="vehicle-make">${vehicle['Make/Model']}</div>
                        <div class="vehicle-owner">${vehicle['Owner Name']} • ${vehicle.VIN}</div>
                    </div>
                    <i class="fas fa-chevron-right"></i>
                `;
                
                vehicleElement.addEventListener('click', () => {
                    selectVehicle(vehicle);
                });
                
                resultsContainer.appendChild(vehicleElement);
            });
        }
        
        function selectVehicle(vehicle) {
            // Display vehicle info
            document.getElementById('ownerName').textContent = vehicle['Owner Name'];
            document.getElementById('mobile').textContent = formatPhoneNumber(vehicle.Mobile);
            document.getElementById('makeModel').textContent = vehicle['Make/Model'];
            document.getElementById('vin').textContent = vehicle.VIN;
            
            // Set hidden form values
            document.getElementById('vehicleId').value = vehicle.id;
            document.getElementById('vinNumber').value = vehicle.VIN;
            document.getElementById('ownerNameField').value = vehicle['Owner Name'];
            document.getElementById('mobileField').value = vehicle.Mobile;
            document.getElementById('makeModelField').value = vehicle['Make/Model'];
             document.getElementById('remarksField').value = vehicle.Remarks || '';
            
            // Show vehicle info and service form
            document.getElementById('vehicleInfo').style.display = 'block';
            document.getElementById('serviceForm').style.display = 'block';
            
            // Scroll to service form
            setTimeout(() => {
                document.getElementById('serviceForm').scrollIntoView({ behavior: 'smooth' });
            }, 100);
        }
        
        async function scheduleMaintenance(e) {
            e.preventDefault();
            
            const vehicleId = document.getElementById('vehicleId').value;
            const serviceDate = document.getElementById('serviceDate').value;
            const serviceType = document.getElementById('serviceType').value;
            const serviceNotice = document.getElementById('serviceNotice').value;
            const serviceStatus = document.getElementById('serviceStatus').value;
            const vin = document.getElementById('vinNumber').value;
            const ownerName = document.getElementById('ownerNameField').value;
            const mobile = document.getElementById('mobileField').value;
            const makeModel = document.getElementById('makeModelField').value;
            const remarks = document.getElementById('remarksField').value;
            
            if (!vehicleId || !serviceDate || !serviceType) {
                showAlert('Please fill in all required fields', 'error');
                return;
            }
            
            try {
                showLoader(true);
                
                const response = await fetch(`https://api.baserow.io/api/database/rows/table/${MAINTENANCE_TABLE_ID}/?user_field_names=true`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Token ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        "Vehicle ID": parseInt(vehicleId),
                        "Service Date": serviceDate,
                        "Service Status": serviceStatus,
                        "Service Type": serviceType,
                        "Service Notes": serviceNotice,
                        "VIN": vin,
                        "Owner Name": ownerName,
                        "Mobile": mobile,
                        "Make/Model": makeModel,
                        "Remarks": remarks
                    })
                });
                
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                
                const data = await response.json();
                showAlert('Maintenance scheduled successfully!', 'success');
                resetForm();
                
            } catch (error) {
                console.error('Error scheduling maintenance:', error);
                showAlert('Error scheduling maintenance. Please try again.', 'error');
            } finally {
                showLoader(false);
            }
        }
        
        function resetForm() {
            document.getElementById('maintenanceForm').reset();
            document.getElementById('vehicleInfo').style.display = 'none';
            document.getElementById('serviceForm').style.display = 'none';
            document.getElementById('searchResults').innerHTML = '';
            document.getElementById('searchTerm').value = '';
        }
        
        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.style.position = 'fixed';
            alertDiv.style.top = '20px';
            alertDiv.style.right = '20px';
            alertDiv.style.padding = '1rem 1.5rem';
            alertDiv.style.borderRadius = 'var(--border-radius)';
            alertDiv.style.boxShadow = 'var(--shadow)';
            alertDiv.style.zIndex = '1000';
            alertDiv.style.display = 'flex';
            alertDiv.style.alignItems = 'center';
            alertDiv.style.gap = '0.75rem';
            alertDiv.style.animation = 'fadeIn 0.3s ease-in-out';
            
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
            const bgColor = type === 'success' ? '#4caf50' : '#f44336';
            
            alertDiv.style.backgroundColor = bgColor;
            alertDiv.style.color = 'white';
            
            alertDiv.innerHTML = `
                <i class="fas ${icon}" style="font-size: 1.25rem;"></i>
                <span>${message}</span>
            `;
            
            document.body.appendChild(alertDiv);
            
            setTimeout(() => {
                alertDiv.style.animation = 'fadeOut 0.3s ease-in-out';
                setTimeout(() => {
                    alertDiv.remove();
                }, 300);
            }, 3000);
        }
        
        function showLoader(show) {
            const loader = document.getElementById('loader') || createLoader();
            if (show) {
                loader.style.display = 'flex';
            } else {
                loader.style.display = 'none';
            }
        }
        
        function createLoader() {
            const loader = document.createElement('div');
            loader.id = 'loader';
            loader.style.position = 'fixed';
            loader.style.top = '0';
            loader.style.left = '0';
            loader.style.width = '100%';
            loader.style.height = '100%';
            loader.style.backgroundColor = 'rgba(255, 255, 255, 0.8)';
            loader.style.zIndex = '9999';
            loader.style.display = 'none';
            loader.style.justifyContent = 'center';
            loader.style.alignItems = 'center';
            loader.style.flexDirection = 'column';
            
            loader.innerHTML = `
                <div class="spinner" style="width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite;"></div>
                <p style="margin-top: 1rem; color: var(--dark);">Processing...</p>
            `;
            
            document.body.appendChild(loader);
            return loader;
        }
        
        function formatPhoneNumber(phone) {
            // Simple phone number formatting
            return phone.replace(/(\d{3})(\d{3})(\d{4})/, '($1) $2-$3');
        }
    </script>
</body>
</html>
